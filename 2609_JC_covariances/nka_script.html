    if(!root.dataset.staged) return Infinity;
    if(!(window.Reveal && Reveal.getIndices)) return 0;
    var f = Reveal.getIndices().f;
    return (typeof f === 'number' && f >= 0) ? f + 1 : 0;
  }
  function effectiveStep(root){
    var base = +root.getAttribute('data-step');
    var fs = root.getAttribute('data-frag-step');
    if(fs && window.Reveal && Reveal.getIndices){
      var f = Reveal.getIndices().f;
      if(typeof f === 'number' && f >= 0) return +fs;
    }
    return base;
  }
  function renderOne(root){
    var step = effectiveStep(root), stage = stageOf(root);
    var q = function(sel){ return root.querySelector(sel); };
    // On the build slide the animation owns the ledger (it reveals the relations
    // at the last beat), so renderOne must not overwrite it.
    var eqs = q('.eqs');
    if(eqs) ledger(eqs, step, +root.dataset.ledgerFrom || 0, stage);
    var cost = q('.cost');
    if(cost) cost.innerHTML = COST[step] || '';
    root.classList.toggle('has-cost', !!COST[step]);
    var pk = q('.pick'); if(pk) picker(pk);

    var pA = q('.pA');
    if(pA) drawField(pA, {h: +pA.dataset.h || 200, mask: step >= 2 && stage >= 0,
                          x0: +pA.dataset.x0 || undefined, w: +pA.dataset.w || undefined});
    var pM = q('.pM');
    if(pM){
      if(!pM.__modes) buildModes(pM);
      // click-driven: n is the fragment stage (0 = nothing landed yet). A
      // print export has no clicks to walk, so give it the finished state.
      setModeBeat(pM, PRINT ? NM : stage);
    }
    var pK = q('.pK');
    if(pK) drawKernelPanel(pK, {h: +pK.dataset.h || 200,
                                x0: +pK.dataset.x0 || undefined, w: +pK.dataset.w || undefined});
    var pC = q('.pC');
    if(pC) drawSpectrum(pC, {
      h: +pC.dataset.h || 260,
      x0: +pC.dataset.x0 || undefined,
      w:  +pC.dataset.w  || undefined,
      marks: pC.dataset.marks === '1',
      kernel: pC.dataset.kernel === '1' && stage >= (+pC.dataset.kernelAt || 0),
      kh: +pC.dataset.kh || 150,
      err: pC.dataset.err === '1',
      tilde: pC.dataset.tilde === '1' && stage >= (+pC.dataset.tildeAt || 0),
      bins: pC.dataset.bins === '1',
      binned: pC.dataset.binned === '1',
      decoupled: pC.dataset.decoupled === '1',
      label: pC.dataset.label !== '0',
      xlabel: pC.dataset.xlabel !== '0'
    });
    var each = function(sel, fn){ var e = q(sel); if(e) fn(e, {
      h: +e.dataset.h || undefined, x0: +e.dataset.x0 || undefined,
      w: +e.dataset.w || undefined,
      //  data-foot-at="1": this panel switches to the holed-footprint catalogue
      //  once fragment 1 is showing. PRINT has no fragments to walk, so a pdf
      //  export gets the finished state.
      foot: e.dataset.footAt != null && (PRINT || stage >= +e.dataset.footAt),
      //  data-cloud="1": this panel is on the band-limit slide, so the theta_c
      //  slider drives it -- the comb blooms into clouds, the spectrum picks up
      //  the cloud's transform.
      cloud: e.dataset.cloud === '1',
      pixel: e.dataset.pixel === '1',
      stage: stage }); };
    each('.pP',    drawCatalogue);
    each('.pPair', drawPairs);
    each('.pXiC',  drawXiCat);
    drawProj(root);
    each('.pMps',  drawMaskPS);
    each('.pKC',   drawCatKernel);
    each('.pProd', drawProducts);
    each('.pCloud',drawCloud);
    each('.pXi',   drawXi);
    each('.pWhite',drawWhite);
    //  the readout has to be right before anyone touches the slider
    var v0 = root.querySelector('.ctl-slider .val');
    if(v0) v0.innerHTML = THC <= 0
      ? '= 0 — bare deltas'
      : '= ' + (THC*CAT.xs.length).toFixed(2) + ' × the spacing';
    var sl = root.querySelectorAll('input[type=range]');
    for(var si=0; si<sl.length; si++) (function(inp){
      if(inp.__wired) return; inp.__wired = 1;
      inp.oninput = function(){
        if(inp.dataset.var === 'N') NSRC = +inp.value;
        if(inp.dataset.var === 'thc') THC = (+inp.value)/10000;
        var lab = inp.parentNode.querySelector('.val');
        if(lab && inp.dataset.var === 'thc') lab.innerHTML = THC <= 0
          ? '= 0 — bare deltas'
          : '= ' + (THC*CAT.xs.length).toFixed(2) + ' × the spacing';
        renderOne(root); typeset();
      };
    })(sl[si]);
    //  ONLY the covariance slide's three-matrix row. The projection slide also
    //  has canvases, and drawMatrices was painting its f_sky / iNKA / quartic
    //  panels with exact / NKA / error instead.
    if(q('.mrow canvas')) drawMatrices(root);
  }
  // MathJax is loaded async from a CDN and may not have started when this runs,
  // so wait on its startup promise; retry until it exists.
  function typeset(){
    if(window.MathJax && MathJax.startup && MathJax.startup.promise)
      MathJax.startup.promise.then(function(){ return MathJax.typesetPromise(); })
                             .catch(function(){});
    else if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    else setTimeout(typeset, 150);
  }
  function renderAll(){
    for(var i=0;i<ROOTS.length;i++) renderOne(ROOTS[i]);
    typeset();
  }

  buildAll();
  renderAll();
  // reveal only lays a slide out when it becomes current; redraw then, cheaply
  (function attach(){
    if(!(window.Reveal && Reveal.on && typeof Reveal.getIndices === 'function')){
      setTimeout(attach, 150); return;
    }
    // A slide that stages itself with fragments re-renders its ledger and cost
    // label as they come and go (the covariance slide: four-point -> NKA).
    function refresh(){
      var st0 = document.querySelector('.present .nka[data-staged]');
      if(st0){ renderOne(st0); typeset(); }
      var r = document.querySelector('.present .nka[data-frag-step]');
      if(!r) return;
      var st = effectiveStep(r);
      var eqs = r.querySelector('.eqs');
      if(eqs) ledger(eqs, st, +r.dataset.ledgerFrom || 0);
      var cost = r.querySelector('.cost');
      if(cost){ cost.innerHTML = COST[st] || ''; }
      r.classList.toggle('has-cost', !!COST[st]);
      typeset();
    }
    Reveal.on('fragmentshown',  refresh);
    Reveal.on('fragmenthidden', refresh);
    Reveal.on('slidechanged', function(ev){
      var r = ev.currentSlide && ev.currentSlide.querySelector('.nka[data-step]');
      if(!r) return;
      renderOne(r); typeset();
    });
  })();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
