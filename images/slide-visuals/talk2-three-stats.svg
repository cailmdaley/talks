<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-labelledby="ttl dsc" font-family="EB Garamond, Georgia, serif">
  <title id="ttl">Filter-response of three B-mode statistics across angular scale</title>
  <desc id="dsc">Three mini-axes share one angular-scale axis running coarse to fine, left to right. The real-space statistic weights large scales with a broad smooth curve; COSEBIs weight an intermediate band with a compact, ringing curve centred on the MegaCam CCD scale; the harmonic statistic weights fine scales. A dashed guide at the CCD scale crosses all three, falling where the real- and harmonic-space curves are diffuse but COSEBIs concentrate sensitivity.</desc>

  <!-- ============================================================
       Geometry
       3 panels, each plot box 168w x 96h.
       Panel origins (x of left edge of plot box):
         P1 x=44, P2 x=296, P3 x=548   (gap 84 between boxes)
       Plot box top y=80, baseline y=176 (80+96).
       CCD guide sits at local x=102 within each box (absolute x: 146, 398, 650).
       Title band: symbol y=46, subtitle y=63. CCD strip: label y=20, range y=33.
       ============================================================ -->

  <!-- CCD-scale guide: one dashed hairline through all three panels, labelled once at top -->
