<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360"
     font-family="EB Garamond, Georgia, serif" role="img" aria-labelledby="t d">
  <title id="t">One feature, three readouts: the same CCD-scale B-mode, filtered three ways</title>
  <desc id="d">A single compact contamination at the MegaCam chip boundaries fans out to three
    statistics. Cosmic-shear xi-B and harmonic C-ell BB dilute it below significance and pass;
    only the COSEBIs basis compresses it into a coherent oscillation crossing four sigma and
    fails. Recomputed from the same C-ell bandpowers, COSEBIs still fail: the disagreement is set
    by the filter, not by real- versus harmonic-space.</desc>

  <defs>
    <!-- hairline open arrowhead, ink-muted, for the fan-out -->
    <marker id="ah" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5"
            orient="auto-start-reverse">
      <path d="M1 1.4 L8.4 5 L1 8.6" fill="none" stroke="#7A6F5C" stroke-width="1.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ================================================================
       LEFT — the single source: a 3x3 MegaCam CCD grid with a cinnabar
       discontinuity zig-zagging along the chip seams.
       Grid block: x 44..172, y 96..224 (128 wide, square cells ~42.7).
       =============================================================== -->

  <!-- the 3x3 chip grid, hairline -->
  <g fill="none" stroke="#C5B89E" stroke-width="1" stroke-linejoin="round">
    <rect x="44"  y="96"  width="42.7" height="42.7"/>
    <rect x="86.7" y="96"  width="42.7" height="42.7"/>
    <rect x="129.4" y="96"  width="42.6" height="42.7"/>
    <rect x="44"  y="138.7" width="42.7" height="42.7"/>
    <rect x="86.7" y="138.7" width="42.7" height="42.7"/>
    <rect x="129.4" y="138.7" width="42.6" height="42.7"/>
    <rect x="44"  y="181.4" width="42.7" height="42.6"/>
    <rect x="86.7" y="181.4" width="42.7" height="42.6"/>
    <rect x="129.4" y="181.4" width="42.6" height="42.6"/>
  </g>

  <!-- a faint per-CCD "constant ellipticity" tick in each cell (the offset that is flat within a
       chip and jumps at the seam) — short ink-muted strokes, very light -->
  <g stroke="#C5B89E" stroke-width="1" stroke-linecap="round" opacity="0.7">
    <line x1="57"  y1="117"  x2="74"  y2="119"/>
    <line x1="99"  y1="117"  x2="116" y2="114"/>
    <line x1="142" y1="117"  x2="159" y2="120"/>
    <line x1="57"  y1="160"  x2="74"  y2="157"/>
    <line x1="99"  y1="160"  x2="116" y2="163"/>
    <line x1="142" y1="160"  x2="159" y2="157"/>
    <line x1="57"  y1="202"  x2="74"  y2="205"/>
    <line x1="99"  y1="202"  x2="116" y2="200"/>
    <line x1="142" y1="202"  x2="159" y2="203"/>
  </g>

  <!-- cinnabar discontinuity: a bold zig running the interior seams of the grid (the curl at
       chip edges). Traces the two interior vertical seams and the two interior horizontal seams
       as a single continuous zig-zag fold. -->
  <path d="M86.7 96 L86.7 138.7 L129.4 138.7 L129.4 181.4 L86.7 181.4 L86.7 224"
        fill="none" stroke="#BC4538" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M44 138.7 L86.7 138.7 M129.4 181.4 L172 181.4"
        fill="none" stroke="#BC4538" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- source labels -->
  <text x="108" y="252" text-anchor="middle" font-size="15.5" fill="#7A6F5C">
    constant ellipticity per CCD</text>
  <text x="108" y="271" text-anchor="middle" font-size="15.5" fill="#7A6F5C">
    <tspan fill="#BC4538">curl</tspan> at chip edges</text>
  <text x="108" y="293" text-anchor="middle" font-family="IBM Plex Mono, monospace"
        font-size="13.5" fill="#7A6F5C" letter-spacing="0.04em">6&#8211;14&#8242;</text>

  <text x="108" y="78" text-anchor="middle" font-size="13.5" fill="#7A6F5C"
        font-style="italic" letter-spacing="0.02em">one feature</text>

  <!-- ================================================================
       FAN-OUT — a single hairline trunk leaving the grid, splitting to
       three readout rows. Trunk exits at the grid mid-right (172,160),
       runs to a fork at x=236, then three gentle branches.
       Readout panels are right-aligned; their left edge is x=300.
       Row centres: y = 92, 160, 228.
       =============================================================== -->
  <g fill="none" stroke="#C5B89E" stroke-width="1">
    <path d="M172 160 L236 160"/>
    <path d="M236 160 C 268 160, 268 92,  300 92"  marker-end="url(#ah)"/>
    <path d="M236 160 L300 160"                      marker-end="url(#ah)"/>
    <path d="M236 160 C 268 160, 268 228, 300 228"  marker-end="url(#ah)"/>
  </g>
  <circle cx="236" cy="160" r="1.7" fill="#C5B89E"/>

  <!-- ================================================================
       RIGHT — three readout glyphs. Each panel: a hairline baseline
       (the zero / pass line), a small trace, a left tag and a verdict.
       Trace plotting window: x 318..560, height band +/-22 about the row
       centre. Verdict at x=600. Stat tag at x=300 (left of window).
       =============================================================== -->

  <!-- shared zero baselines, hairline dotted -->
  <g stroke="#C5B89E" stroke-width="1" stroke-dasharray="1 4">
    <line x1="318" y1="92"  x2="560" y2="92"/>
    <line x1="318" y1="160" x2="560" y2="160"/>
    <line x1="318" y1="228" x2="560" y2="228"/>
  </g>

  <!-- ROW 1 : xi_pm^B (teal) — nearly flat, faint ripple, PASSES -->
  <text x="300" y="78" font-size="16" fill="#3F8278">&#958;<tspan dy="3" font-size="11">&#177;</tspan><tspan dy="-3" baseline-shift="super" font-size="11">B</tspan></text>
  <path d="M318 92 C 340 90, 360 94, 384 91 S 432 93, 456 90 S 512 94, 536 91 L560 92"
        fill="none" stroke="#3F8278" stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round"/>
  <g>
    <path d="M584 92 l4 5 l8 -11" fill="none" stroke="#3F8278" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="602" y="96" font-size="15" fill="#3F8278">passes</text>
  </g>

  <!-- ROW 3 : C_ell^BB (cobalt) — low scatter near zero, PASSES -->
  <!-- (drawn before row 2 so the climax sits visually last/topmost in z-order is fine; order
        here is purely source-order, no overlap) -->
  <text x="300" y="214" font-size="16" fill="#3D5BA0">C<tspan dy="3" font-size="11">&#8467;</tspan><tspan dy="-3" baseline-shift="super" font-size="11">BB</tspan></text>
  <!-- bandpower markers: small dots scattering tightly about the baseline, with thin error whiskers -->
  <g stroke="#3D5BA0" stroke-width="1.2" stroke-linecap="round">
    <line x1="334" y1="222" x2="334" y2="234"/>
    <line x1="372" y1="226" x2="372" y2="238"/>
    <line x1="410" y1="220" x2="410" y2="232"/>
    <line x1="448" y1="225" x2="448" y2="237"/>
    <line x1="486" y1="221" x2="486" y2="233"/>
    <line x1="524" y1="226" x2="524" y2="238"/>
  </g>
  <g fill="#3D5BA0">
    <circle cx="334" cy="228" r="2.1"/>
    <circle cx="372" cy="232" r="2.1"/>
    <circle cx="410" cy="226" r="2.1"/>
    <circle cx="448" cy="231" r="2.1"/>
    <circle cx="486" cy="227" r="2.1"/>
    <circle cx="524" cy="232" r="2.1"/>
  </g>
  <g>
    <path d="M584 228 l4 5 l8 -11" fill="none" stroke="#3D5BA0" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="602" y="232" font-size="15" fill="#3D5BA0">passes</text>
  </g>

  <!-- ROW 2 : COSEBIs (cinnabar) — coherent oscillation crossing 4 sigma, FAILS -->
  <!-- dashed cinnabar threshold lines at the 4-sigma envelope, faint -->
  <g stroke="#BC4538" stroke-width="1" stroke-dasharray="3 4" opacity="0.55">
    <line x1="318" y1="142" x2="560" y2="142"/>
    <line x1="318" y1="178" x2="560" y2="178"/>
  </g>
  <text x="556" y="138" text-anchor="end" font-family="IBM Plex Mono, monospace"
        font-size="11" fill="#BC4538" opacity="0.85">4&#963;</text>

  <text x="300" y="146" font-size="16" font-weight="600" fill="#BC4538">COSEBIs</text>
  <!-- the coherent oscillation: discrete E/B-mode order n -> a connected fingerprint that grows
       and crosses the 4 sigma envelope. -->
  <path d="M318 162 C 330 150, 338 134, 350 134 S 368 158, 380 172 S 400 186, 412 186
           S 432 160, 444 146 S 464 132, 476 132 S 494 160, 506 174 S 526 186, 538 178 L560 168"
        fill="none" stroke="#BC4538" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- mode markers riding the oscillation, emphasising the discrete COSEBI orders -->
  <g fill="#BC4538">
    <circle cx="350" cy="134" r="2.4"/>
    <circle cx="412" cy="186" r="2.4"/>
    <circle cx="476" cy="132" r="2.4"/>
    <circle cx="538" cy="178" r="2.4"/>
  </g>
  <g>
    <path d="M584 154 l11 11 M595 154 l-11 11" fill="none" stroke="#BC4538" stroke-width="2.2"
          stroke-linecap="round"/>
    <text x="602" y="166" font-size="16" font-weight="600" fill="#BC4538">fails</text>
    <text x="602" y="184" font-size="12.5" font-family="IBM Plex Mono, monospace"
          fill="#BC4538">&gt;4&#963;</text>
  </g>

  <!-- ================================================================
       BOTTOM — the clinch, as a thin bracket spanning the three rows.
       Bracket sits under the three panels (x 300..612) and drops a stem
       to the caption.
       =============================================================== -->
  <path d="M300 312 v-7 h312 v7" fill="none" stroke="#C5B89E" stroke-width="1"
        stroke-linecap="round"/>
  <line x1="456" y1="312" x2="456" y2="320" stroke="#C5B89E" stroke-width="1"/>
  <text x="456" y="338" text-anchor="middle" font-size="14.5" fill="#7A6F5C"
        font-style="italic" letter-spacing="0.01em">recompute COSEBIs from the C<tspan font-size="11" baseline-shift="sub">&#8467;</tspan> bandpowers &#8212; same data &#8212; still fails</text>
  <text x="456" y="357" text-anchor="middle" font-size="14.5" fill="#1B1611"
        letter-spacing="0.01em">the disagreement is the <tspan fill="#BC4538">filter</tspan>, not the space</text>
</svg>
