<script>
// ═══════════════════════════════════════════════════════════════════════════
//  HANDOFF — the engine behind the CosmoStat JC covariance deck
//  (2609_JC_covariances). Read this before changing anything here.
//
//  WHAT THIS IS
//  One script drives every animated slide. Each slide carries a container
//      <div class="nka" data-step="N"> … </div>
//  holding only the panels that step needs. This file fills every container
//  once at load, and re-fills the mask-dependent ones when the picker changes.
//  It is pulled in through `include-after-body` in the qmd, so it runs after
//  every slide has been parsed — do NOT move it into a slide's html block.
//
//  DELIVERY FLOW (do all four, in order)
//    1. cd ~/Documents/projects/talks
//    2. quarto render 2609_JC_covariances/2609_JC_covariances.qmd \
//         -M embed-resources:true          # sibling assets do not resolve in
//                                          # Cail's viewer; must be self-contained
//    3. cp _site/2609_JC_covariances/index.html \
//         ~/loom/.felt/work/talks/2609-jc-covariances/deck.html
//    4. screenshot the LOOM COPY, not the _site build, and look at the images.
//
//  QA LOOP — three checks, all of which have caught real bugs
//    a) node --check <(sed -n '/^<script>/,/^<\/script>/p' nka_script.html \
//                      | sed '1d;$d')
//       Splicing this file by string index has twice deleted a function or left
//       a duplicated tail, which blanks every slide. Run this after every edit.
//    b) puppeteer + a console/pageerror listener. A blank panel is usually a
//       ReferenceError, not a layout problem. (`Cannot read … 'Config'` on load
//       comes from the shared MathJax asset and is harmless.)
//    c) OVERFLOW must be measured in SLIDE coordinates, not viewport pixels.
//       Reveal scales the 1920x1080 stage (≈0.9 here) and centres it, so a
//       getBoundingClientRect().bottom of 1005 can be 1057 on the slide. Walk
//       the DOM summing offsetTop to the section and compare against 1080 (the
//       slide box; the footer sits at ≈1090). Keep content ≤ ~990 for margin.
//
//  ARCHITECTURE
//  · data-step  — which point in the argument the slide is at. Drives which
//                 ledger entries exist and which cost label shows.
//  · EQS        — the ledger, one array, rendered as a CSS grid. Each entry is
//                 {tex, step, name, col, row, span?, note?, sub?}. The GRID IS
//                 THE ARGUMENT: row 1 is the unmasked field, row 2 is what the
//                 mask does with each masked object directly under its unmasked
//                 twin, row 3 is how you undo it. Do not reflow it casually.
//                 `sub` lights one entry per fragment on a staged slide.
//                 data-ledger-from makes a slide start a fresh ledger (the
//                 covariance and Wolz slides do).
//  · data-staged — the slide reveals its own panels with reveal fragments;
//                 stageOf() turns the fragment index into a stage number that
//                 the panel options and ledger `sub` read. Used by slide 4.
//  · data-frag-step — simpler variant: the slide's step advances by one once
//                 any fragment shows (the covariance slide: four-point → NKA).
//  · cine       — the "sum of modes" build. Elements are created ONCE by
//                 buildCine() and only their opacity changes, so the CSS
//                 transitions actually run. setBeat(n) is the whole state
//                 machine; the beat plan is documented above it. The running
//                 sum is two cross-faded paths because path geometry cannot be
//                 tweened, and it is rescaled every beat so what changes is the
//                 STRUCTURE (a two-mode partial sum on a fixed scale looks like
//                 nothing is happening).
//  · picker / NSRC / THC — module-level globals, deliberately shared across
//                 slides: one mask and one catalogue run through the whole
//                 deck, so changing sources on W1 is visible on W2 and W3.
//                 buildAll() recomputes everything; renderAll() redraws.
//  · panels     — a slide asks for panels by class: .pA field, .pM cine,
//                 .pC spectrum, .pZ zoo (unused now), .pP catalogue,
//                 .pKC catalogue kernel, .pProd mask products, .pCloud clouds,
//                 .pXi correlation function, .pWhite white floor, plus canvases
//                 for the covariance matrices. Options come from data-* on the
//                 element; geom() lets a panel take a sub-width so panels can
//                 sit in columns.
//
//  TWO GOTCHAS THAT WILL BITE
//  · Reveal is NOT ready when this file runs. attach() polls until
//    Reveal.on/getIndices exist. Registering listeners unguarded silently does
//    nothing — the fragments advance and the drawing never changes.
//  · MathJax is loaded async and has already typeset the page by the time any
//    ledger is injected. Every path that rewrites .eqs innerHTML must call
//    typeset() afterwards — including the slider handlers. Missing it shows raw
//    \( … \) on the slide.
//
//  PHYSICS NOTES worth keeping
//  · Kernel width is quoted as a RADIUS: "± n modes", n = mixRadius(), the
//    half-width holding half the OFF-diagonal coupling power. The m = 0 self
//    term dominates |W|² for any mask, so counting it makes every mask look
//    narrow. Same words and same definition on every slide.
//  · The NKA readout is pullOutError(): C at the midpoint divided by the
//    kernel-weighted mean of C. That is exactly what the approximation does.
//    max/min across the kernel is WRONG at a local extremum — on the bump peak
//    it read ×1.1 while the covariance error was +25%.
//  · Decoupling is done in BANDPOWERS. The unbinned coupling matrix is not
//    invertible in any useful sense (its Toeplitz symbol is the mask squared,
//    so every mode the mask kills is a null direction) — the first attempt
//    returned NaN. Binning to about the kernel width is what NaMaster does.
//
//  ELSEWHERE
//  · The 1D toy that backs slides 3–5 and the parked Nagura slides lives in
//    notes/projection_experiment.py, written up in notes/projection-experiment.md.
//  · Three parked slides sit at the end of the qmd behind reveal's
//    visibility="hidden"; their data ships in nka_data.html. Delete one
//    attribute to bring each back.
// ═══════════════════════════════════════════════════════════════════════════
(function(){
"use strict";
function boot(){
  var ROOTS = document.querySelectorAll('.nka[data-step]');
  if(!ROOTS.length) return;

  // ---------- config ----------
  var N = 512, NX = 1024;          // modes, real-space samples
  var KLO = 6, KHI = 156, NK = KHI - KLO;   // covariance matrix range
  var KMAX = 250;                  // modes drawn in the harmonic panels
  var K0 = 84;                     // where the kernel sits: on the bump's flank,
                                   // where the NKA is visibly wrong but not absurd
  var NB = 12;                     // bandpower width, ~ the kernel width
  var MODES = [4, 12, 30, 78, 150];   // the modes that build the field, low k to high
  var BEAT  = 620;                    // ms between beats; the fades run longer,
                                      // so consecutive beats overlap slightly

  var INK='#1B1611', MUT='#7A6F5C', ACC='#BC4538', COB='#3D5BA0',
      TEAL='#3F8278', RULE='#C5B89E', FAINT='#C5B89E', GRID='#E0D5BF';

  // A pronounced bump gives two regimes: the smooth part, where the NKA holds,
  // and the bump, where it does not.
  function Cfun(k){ var a = Math.abs(k);
    return (1.0/Math.pow(1.0 + a/18.0, 1.6)) * (1 + 2.5*Math.exp(-Math.pow((a-78)/6,2))); }

  function mulberry(a){ return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(rng){ var u = 1 - rng(), v = rng();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

  // ---------- one realisation of the field, and its modes ----------
  var field = new Float64Array(NX), fscale = 1;
  var modeRe = {}, modeIm = {};
  (function(){
    var rng = mulberry(20260903), re = {}, im = {};
    for(var k=1;k<N/2;k++){
      var s = Math.sqrt(Cfun(k)/2);
      re[k] = gauss(rng)*s; im[k] = gauss(rng)*s;
      for(var j=0;j<NX;j++){
        var ph = 2*Math.PI*k*j/NX;
        field[j] += 2*(re[k]*Math.cos(ph) - im[k]*Math.sin(ph));
      }
    }
    var mx = 0; for(var j2=0;j2<NX;j2++) mx = Math.max(mx, Math.abs(field[j2]));
    fscale = mx;
    for(var j3=0;j3<NX;j3++) field[j3] /= mx;
    for(var q=0;q<MODES.length;q++){ modeRe[MODES[q]] = re[MODES[q]]/mx; modeIm[MODES[q]] = im[MODES[q]]/mx; }
  })();
  function modeAt(k, j){
    var ph = 2*Math.PI*k*j/NX;
    return 2*(modeRe[k]*Math.cos(ph) - modeIm[k]*Math.sin(ph));
  }

  // ---------- masks ----------
  function ramp(t){ return 0.5*(1 - Math.cos(Math.PI*Math.max(0,Math.min(1,t)))); }
  function makeMask(width, nholes, apod){
    var w = new Float64Array(NX), ap = Math.max(apod*NX, 1);
    var half = width*NX/2, mid = NX/2;
    for(var j=0;j<NX;j++) w[j] = ramp((half - Math.abs(j-mid))/ap + 0.5);
    if(nholes > 0){
      var rng = mulberry(4242), inner = width*NX - 2*ap;
      for(var h=0; h<nholes; h++){
        var hw = Math.max(inner/(3.2*nholes), 2*ap*0.6);
        var c  = mid - inner/2 + (h + 0.15 + 0.7*rng())*inner/nholes;
        for(var j2=0;j2<NX;j2++) w[j2] *= 1 - ramp((hw/2 - Math.abs(j2-c))/ap + 0.5);
      }
    }
    return w;
  }
  var MASKS = [
    {w:0.55, h:0, a:0.070, name:'wide, smooth'},
    {w:0.16, h:0, a:0.030, name:'small'},
    {w:0.55, h:5, a:0.010, name:'holes'}
  ];
  var pick = 1;                    // the working mask

  // ---------- transforms ----------
  var COS = new Float64Array(NX), SIN = new Float64Array(NX);
  for(var t0=0;t0<NX;t0++){ COS[t0]=Math.cos(2*Math.PI*t0/NX); SIN[t0]=Math.sin(2*Math.PI*t0/NX); }
  function transform(w){
    var re = new Float64Array(N), im = new Float64Array(N), sp = 0;
    for(var mi=0; mi<N; mi++){
      var m = mi < N/2 ? mi : mi - N, sr = 0, si = 0;
      for(var jj=0; jj<NX; jj++){
        var idx = (m*jj) % NX; if(idx < 0) idx += NX;
        sr += w[jj]*COS[idx]; si -= w[jj]*SIN[idx];
      }
      re[mi] = sr/NX; im[mi] = si/NX;
      sp += re[mi]*re[mi] + im[mi]*im[mi];
    }
    return {re:re, im:im, sumP:sp};
  }

  var mask, Wre, Wim, sumP;
  function Wat(m, part){
    if(m <= -N/2 || m >= N/2) return 0;
    var i = (m + N) % N;
    return part ? Wim[i] : Wre[i];
  }
  function kpow(m){ var r = Wat(m,0), i = Wat(m,1); return r*r + i*i; }

  //   How many neighbours each mode mixes with: the half-width of the smallest
  //   symmetric window in |W_m|^2 holding half the OFF-diagonal coupling power.
  //   The m = 0 self term carries most of |W|^2 for any mask, so counting it makes
  //   every mask look narrow. One name for this everywhere in the deck: "± n
  //   modes", said as "each k mixes with its n neighbours either side".
  function mixRadius(pow, mmax){
    var tot = 0, m;
    for(m=1;m<=mmax;m++) tot += 2*pow(m);
    if(tot <= 0) return 1;
    var acc = 0, n = 0;
    while(acc < 0.5*tot && n < mmax){ n++; acc += pow(-n) + pow(n); }
    return Math.max(n, 1);
  }
  function pmLabel(n){ return '\u00b1' + n + (n === 1 ? ' mode' : ' modes'); }
  var WIDTH_CAPTION = 'kernel width — how many neighbouring modes each k mixes with';

  // ---------- derived ----------
  var Cin = new Float64Array(KMAX+2), Ctil = new Float64Array(KMAX+2);
  var covE = new Float64Array(NK*NK), covN = new Float64Array(NK*NK);
  var NBIN = Math.floor(KMAX/NB);
  var Cdecb = new Float64Array(NBIN), Ctilb = new Float64Array(NBIN);
  function binCentre(b){ return 1 + b*NB + (NB-1)/2; }

  function buildAll(){
    var M = MASKS[pick];
    mask = makeMask(M.w, M.h, M.a);
    var T = transform(mask); Wre = T.re; Wim = T.im; sumP = T.sumP;
    for(var k=1;k<=KMAX;k++){
      Cin[k] = Cfun(k);
      var acc = 0;
      for(var kp=-N/2; kp<N/2; kp++) acc += kpow(k-kp)*Cfun(kp);
      Ctil[k] = acc/sumP;
    }
    decouple();
    covariances();
  }

  // Bandpowers. The unbinned coupling matrix is not invertible in any useful
  // sense — the symbol of the Toeplitz operator is the mask squared, so every
  // mode the mask kills is a null direction. Binning to about the kernel width
  // is what makes the inverse well posed, and it is what NaMaster does.
  function decouple(){
    var n = NBIN, A = new Float64Array(n*n), b = new Float64Array(n);
    for(var i=0;i<n;i++){
      for(var j=0;j<n;j++){
        var acc = 0;
        for(var k=0;k<NB;k++) for(var kp=0;kp<NB;kp++)
          acc += kpow((1+i*NB+k) - (1+j*NB+kp));
        A[i*n+j] = acc/(NB*sumP);
      }
      var st = 0;
      for(var k2=0;k2<NB;k2++) st += Ctil[1+i*NB+k2];
      b[i] = st/NB; Ctilb[i] = b[i];
    }
    for(var c=0;c<n;c++){
      var piv = c, best = Math.abs(A[c*n+c]);
      for(var r=c+1;r<n;r++){ var v = Math.abs(A[r*n+c]); if(v>best){best=v;piv=r;} }
      if(best < 1e-13){ for(var z=0;z<n;z++) Cdecb[z] = NaN; return; }
      if(piv !== c){
        for(var q=0;q<n;q++){ var tm=A[c*n+q]; A[c*n+q]=A[piv*n+q]; A[piv*n+q]=tm; }
        var tb=b[c]; b[c]=b[piv]; b[piv]=tb;
      }
      var d = A[c*n+c];
      for(var q2=c;q2<n;q2++) A[c*n+q2] /= d;
      b[c] /= d;
      for(var r2=0;r2<n;r2++){
        if(r2===c) continue;
        var f = A[r2*n+c]; if(f === 0) continue;
        for(var q3=c;q3<n;q3++) A[r2*n+q3] -= f*A[c*n+q3];
        b[r2] -= f*b[c];
      }
    }
    for(var o=0;o<n;o++) Cdecb[o] = b[o];
  }

  function covariances(){
    var Xre = new Float64Array(2*N), Xim = new Float64Array(2*N);
    for(var d=-N+1; d<N; d++){
      var ar=0, ai=0;
      for(var m=-N/2; m<N/2; m++){
        var wr1=Wat(d+m,0), wi1=Wat(d+m,1), wr2=Wat(m,0), wi2=Wat(m,1);
        ar += wr1*wr2 + wi1*wi2; ai += wi1*wr2 - wr1*wi2;
      }
      Xre[d+N]=ar; Xim[d+N]=ai;
    }
    var n2 = sumP*sumP;
    var Ar = new Float64Array(NK*N), Ai = new Float64Array(NK*N);
    var Br = new Float64Array(NK*N), Bi = new Float64Array(NK*N);
    for(var i=0;i<NK;i++){
      var k = KLO + i;
      for(var qi=0; qi<N; qi++){
        var q = qi - N/2, wr = Wat(k-q,0), wi = Wat(k-q,1), c = Cfun(q);
        Ar[i*N+qi] = wr*c; Ai[i*N+qi] = wi*c;
        Br[i*N+qi] = wr;   Bi[i*N+qi] = wi;
      }
    }
    for(var a=0;a<NK;a++){
      var ka = KLO + a, oa = a*N;
      for(var b=0;b<NK;b++){
        var kb = KLO + b, ob = b*N, sr=0, si=0;
        for(var p=0;p<N;p++){
          var x1r=Ar[oa+p], x1i=Ai[oa+p], x2r=Br[ob+p], x2i=Bi[ob+p];
          sr += x1r*x2r + x1i*x2i; si += x1i*x2r - x1r*x2i;
        }
        covE[a*NK+b] = 2*(sr*sr + si*si)/n2;
        var cb = Cfun((ka+kb)/2), dd = ka-kb+N;
        var nr = cb*Xre[dd], ni = cb*Xim[dd];
        covN[a*NK+b] = 2*(nr*nr + ni*ni)/n2;
      }
    }
  }

  // The error the NKA actually makes: it replaces the kernel-weighted average of
  // C by C at the midpoint. (max/min across the kernel is the wrong statistic —
  // at a local extremum C hardly "varies" either side yet the midpoint sits well
  // above the average, which is exactly when the NKA fails.)
  function pullOutError(kc){
    var num = 0, den = 0;
    for(var m=-N/2+1;m<N/2;m++){
      var p = kpow(m), kk = kc - m;
      if(kk < 1) continue;
      num += p*Cfun(kk); den += p;
    }
    return den > 0 ? Cfun(kc)/(num/den) - 1 : 0;
  }
  function pct(x){ return (x>=0?'+':'') + (100*x).toFixed(0) + '%'; }

  // ---------- svg helpers ----------
  var PRINT = /print-pdf/.test(window.location.search);
  var NS = 'http://www.w3.org/2000/svg';
  function el(p,t,a){ var e=document.createElementNS(NS,t);
    for(var k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; }
  function txt(p,x,y,s,a){ var e=el(p,'text',Object.assign({x:x,y:y,'font-size':28,fill:INK},a||{}));
    e.textContent=s; return e; }
  function clear(s){ while(s.firstChild) s.removeChild(s.firstChild); }
  //  base + subscript + rest, so θ_c renders as a symbol rather than an underscore
  function txtsub(p, x, y, base, sub, rest, a){
    var e = el(p,'text',Object.assign({x:x,y:y,'font-size':26,fill:INK}, a||{}));
    e.appendChild(document.createTextNode(base));
    var t = document.createElementNS(NS,'tspan');
    t.setAttribute('dy','6'); t.setAttribute('font-size','0.72em');
    t.textContent = sub; e.appendChild(t);
    var r = document.createElementNS(NS,'tspan');
    r.setAttribute('dy','-6'); r.textContent = rest; e.appendChild(r);
    return e;
  }
  var PAD = 90, W1 = 1730, AW = W1 - PAD - 40;
  //  Panels take an optional plot width so they can sit side by side in columns;
  //  everything defaults to the full-bleed geometry.
  var _x0 = PAD, _w = AW;
  function geom(opts){ _x0 = (opts && opts.x0 != null) ? opts.x0 : PAD;
                       _w  = (opts && opts.w  != null) ? opts.w  : AW; }
  function XK(k, kmax){ return _x0 + _w*(k-1)/((kmax||KMAX)-1); }

  //  The range has to cover the whole curve: the bump peak is NOT the maximum —
  //  C(1) is higher — and clipping the first few modes off the top looks like a
  //  drawing bug.
  function logY(y0,h,kmax){
    var lgmax = Math.log10(Cfun(1)) + 0.06, lgmin = Math.log10(Cfun(kmax)) - 0.06;
    return function(c){ return y0 + h*(1 - (Math.log10(c)-lgmin)/(lgmax-lgmin)); };
  }

  // ---------- panels ----------
  function drawField(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var h = opts.h, y0 = opts.y0 || 30, mid = y0 + h/2;
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    if(opts.mask){
      var d = 'M ' + PAD + ' ' + (y0+h);
      for(var j=0;j<NX;j++) d += ' L ' + (PAD+AW*j/(NX-1)).toFixed(1) + ' ' + (y0+h-mask[j]*h*0.94).toFixed(1);
      d += ' L ' + (PAD+AW) + ' ' + (y0+h) + ' Z';
      el(s,'path',{d:d,fill:COB,opacity:0.13});
      var d2='';
      for(var j2=0;j2<NX;j2++) d2 += (j2?'L':'M')+(PAD+AW*j2/(NX-1)).toFixed(1)+' '+(y0+h-mask[j2]*h*0.94).toFixed(1)+' ';
      el(s,'path',{d:d2,fill:'none',stroke:COB,'stroke-width':3});
      txt(s, PAD+AW-230, y0+28, 'mask  w(x)', {fill:COB});
      txt(s, PAD, y0+28, 'observed  w·a', {fill:INK, 'font-size':27});
    }
    function path(masked, col, wid){
      var d='';
      for(var j=0;j<NX;j++){
        var v = field[j]*(masked ? mask[j] : 1);
        d += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(mid - v*h*0.44).toFixed(1)+' ';
      }
      el(s,'path',{d:d,fill:'none',stroke:col,'stroke-width':wid});
    }
    if(opts.mask){ path(false, FAINT, 2); path(true, INK, 3); }
    else path(false, INK, 3);
    txt(s, Math.max(PAD-82, 2), mid+9, 'a(x)', {fill:MUT});
    txt(s, PAD, y0+h+42, opts.xlabel || 'position  x', {fill:MUT});
  }

  // ── the cinematic build ────────────────────────────────────────────────────
  //   Modes fade in one at a time, low k to high; the running sum grows on top;
  //   each mode's |a_k|^2 lights up on the spectrum below. The last beat adds
  //   everything else at once, so the partial sum snaps onto the real field and
  //   the five points become a curve. Elements are built once and only their
  //   opacity changes, so the CSS transitions actually run.
  function partialSum(upto){
    var out = new Float64Array(NX);
    for(var q=0;q<upto;q++){
      var k = MODES[q];
      for(var j=0;j<NX;j++) out[j] += modeAt(k,j);
    }
    return out;
  }
  function buildCine(s){
    clear(s);
    var SUMH = 168, LANE = 52, CY0 = 226 + MODES.length*LANE, CH = 196;
    var st = {modes:[], labels:[], pts:[], sumA:null, sumB:null, which:0, laneY:[],
              curve:null, clabel:null, plus:null, link:null, done:null};
    var mid = 34 + SUMH/2;
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    txt(s, Math.max(PAD-82, 2), mid+9, 'a(x)', {fill:MUT});

    // one shared vertical scale for the lanes, so the spectrum is legible as
    // amplitude: the k = 78 mode really is taller than k = 30, because of the bump
    var big = 0, q, j;
    for(q=0;q<MODES.length;q++)
      for(j=0;j<NX;j+=4) big = Math.max(big, Math.abs(modeAt(MODES[q], j)));
    var lscale = LANE*0.40/Math.max(big,1e-9);

    function pathOf(vals, mid0, sc){
      var d='';
      for(var jj=0;jj<NX;jj++)
        d += (jj?'L':'M')+(PAD+AW*jj/(NX-1)).toFixed(1)+' '+(mid0 - vals[jj]*sc).toFixed(1)+' ';
      return d;
    }
    //  Two sum paths, cross-faded: the running sum's geometry changes every
    //  beat and cannot be tweened directly, so the old curve dissolves into the
    //  new one instead of snapping.
    st.sumA = el(s,'path',{d:'', fill:'none', stroke:INK,'stroke-width':3.5,
                           opacity:0, class:'cine'});
    st.sumB = el(s,'path',{d:'', fill:'none', stroke:INK,'stroke-width':3.5,
                           opacity:0, class:'cine'});
    st.which = 0;
    st.sumH = SUMH; st.sumMid = mid;
    st.lanes = [];

    for(q=0;q<MODES.length;q++){
      var k = MODES[q], y = 226 + q*LANE, lmid = y + LANE*0.45, one = new Float64Array(NX);
      for(j=0;j<NX;j++) one[j] = modeAt(k,j);
      st.lanes.push(el(s,'line',{x1:PAD,y1:lmid,x2:PAD+AW,y2:lmid,stroke:GRID,
                                 'stroke-width':2, opacity:0, class:'cine'}));
      st.modes.push(el(s,'path',{d:pathOf(one, lmid, lscale), fill:'none',
                                 stroke:COB,'stroke-width':3, opacity:0, class:'cine'}));
      st.laneY.push(lmid);
      var t = txt(s, 8, lmid+9, 'k = '+k, {fill:MUT,'font-size':26, opacity:0, class:'cine'});
      st.labels.push(t);
    }
    // above the sum row: it describes what got added to the sum, and every lane
    // below is occupied by a full-width wave
    st.plus = txt(s, PAD+AW-260, 26, '+  everything else',
                  {fill:MUT,'font-size':27, opacity:0, class:'cine'});

    // the spectrum panel
    var Y = logY(CY0, CH, KMAX);
    el(s,'line',{x1:PAD,y1:CY0+CH,x2:PAD+AW,y2:CY0+CH,stroke:RULE,'stroke-width':2});
    txt(s, 4, CY0+18, 'C(k)', {fill:MUT});
    txt(s, PAD, CY0+CH+42, 'wavenumber  k', {fill:MUT});
    var dc='';
    for(var kk=1;kk<KMAX;kk++) dc += (kk>1?'L':'M')+XK(kk,KMAX).toFixed(1)+' '+Y(Cin[kk]).toFixed(1)+' ';
    st.curve = el(s,'path',{d:dc,fill:'none',stroke:INK,'stroke-width':3.5,opacity:0,class:'cine'});
    st.clabel = txt(s, XK(150,KMAX), Y(Cfun(150))-26, 'true  C(k)', {fill:INK,opacity:0,class:'cine'});
    // the connector that links a lane to its point while both are lit
    st.link = el(s,'line',{x1:0,y1:0,x2:0,y2:0,stroke:COB,'stroke-width':2,
                           'stroke-dasharray':'5 7',opacity:0,class:'cine'});
    for(q=0;q<MODES.length;q++){
      var kq = MODES[q];
      st.pts.push(el(s,'circle',{cx:XK(kq,KMAX),cy:Y(Cfun(kq)),r:10,fill:COB,opacity:0,class:'cine'}));
    }
    s.__cine = st;
    return st;
  }
  //  Beat plan:  1..5  modes land, the running sum grows
  //              6      "+ everything else": the sum snaps to the real field
  //              7      the spectrum's curve draws, and the relations arrive
  //              8..12  each mode's |a_k|^2 lands on the curve, flashing with
  //                     its own lane so the two pictures are visibly the same
  //                     five objects
  var NM = MODES.length;
  function setBeat(root, s, n){
    var st = s.__cine; if(!st) return;
    var landed = Math.min(n, NM);                 // how many modes are in
    var summed = n >= NM + 1;                     // the field is complete
    var curve  = n >= NM + 2;                     // the spectrum is drawn
    var pt     = curve ? Math.min(n - (NM + 2), NM) : 0;   // points placed
    var flash  = (curve && n <= 2*NM + 2) ? n - (NM + 2) : -1;  // 1-based lane

    for(var q=0;q<NM;q++){
      var on = (q < landed);
      var lit = (flash === q + 1);
      st.modes[q].style.opacity  = on ? (lit ? 1 : (summed ? 0.30 : 1)) : 0;
      st.modes[q].setAttribute('stroke-width', lit ? 5 : 3);
      st.lanes[q].style.opacity  = on ? 1 : 0;
      st.labels[q].style.opacity = on ? 1 : 0;
      st.labels[q].setAttribute('fill', lit ? COB : MUT);
      st.pts[q].style.opacity    = (q < pt) ? 1 : 0;
      st.pts[q].setAttribute('r', lit ? 14 : 10);
    }
    st.link.style.opacity = 0;
    if(flash >= 1 && flash <= NM){
      var i = flash - 1;
      st.link.setAttribute('x1', st.pts[i].getAttribute('cx'));
      st.link.setAttribute('x2', st.pts[i].getAttribute('cx'));
      st.link.setAttribute('y1', st.laneY[i]);
      st.link.setAttribute('y2', st.pts[i].getAttribute('cy'));
      st.link.style.opacity = 1;
    }

    // Each beat is rescaled to fill its row. A partial sum of a few modes really
    // is a fraction of the field's amplitude, and drawn on a fixed scale it looks
    // like nothing is happening — what changes beat to beat is the STRUCTURE.
    var newD = (function(){
      var vals = summed ? field : partialSum(landed), mx = 0, jj;
      for(jj=0;jj<NX;jj++) mx = Math.max(mx, Math.abs(vals[jj]));
      var sc = st.sumH*0.44/Math.max(mx,1e-9), d='';
      for(jj=0;jj<NX;jj++)
        d += (jj?'L':'M')+(PAD+AW*jj/(NX-1)).toFixed(1)+' '+(st.sumMid - vals[jj]*sc).toFixed(1)+' ';
      return d;
    })();
    var live = st.which ? st.sumB : st.sumA, dead = st.which ? st.sumA : st.sumB;
    if(live.getAttribute('d') !== newD){
      dead.setAttribute('d', newD);
      dead.style.opacity = n > 0 ? 1 : 0;
      live.style.opacity = 0;
      st.which = st.which ? 0 : 1;
    } else {
      live.style.opacity = n > 0 ? 1 : 0;
    }
    st.plus.style.opacity  = summed ? 1 : 0;
    st.curve.style.opacity = curve ? 1 : 0;
    st.clabel.style.opacity = curve ? 1 : 0;

  }
  var cineTimer = null;
  function playCine(root, s){
    if(PRINT) return;
    clearInterval(cineTimer);
    var n = 0, LAST = 2*NM + 2;
    // snap to empty with transitions off, so a replay does not cross-fade the
    // finished picture out while the first mode is fading in
    s.classList.add('nofade');
    if(s.__cine) s.__cine.done = null;
    setBeat(root, s, 0);
    void s.getBoundingClientRect();
    s.classList.remove('nofade');
    cineTimer = setInterval(function(){
      n++; setBeat(root, s, n);
      if(n >= LAST) clearInterval(cineTimer);
    }, BEAT);
  }

  function drawSpectrum(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var y0 = opts.y0 || 26, h = opts.h, Y = logY(y0,h,KMAX);
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    txt(s, Math.max(PAD-86, 2), y0+18, 'C(k)', {fill:MUT});
    if(opts.xlabel !== false) txt(s, PAD, y0+h+42, 'wavenumber  k', {fill:MUT});

    if(opts.bins) for(var b=0;b<NBIN;b+=2){
      var xa = XK(1+b*NB, KMAX), xb = XK(Math.min(1+(b+1)*NB, KMAX), KMAX);
      el(s,'rect',{x:xa,y:y0,width:xb-xa,height:h,fill:MUT,opacity:0.07});
    }

    var d='';
    for(var k=1;k<KMAX;k++) d += (k>1?'L':'M')+XK(k,KMAX).toFixed(1)+' '+Y(Cin[k]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    if(opts.label !== false) txt(s, XK(150,KMAX), Y(Cin[150])-26, 'true  C(k)', {fill:INK});

    //  The masked spectrum is blue, the same blue as the mask and its kernel:
    //  everything the mask did to the measurement reads as one colour.
    if(opts.tilde){
      var d2='';
      for(var k2=1;k2<KMAX;k2++) d2 += (k2>1?'L':'M')+XK(k2,KMAX).toFixed(1)+' '+Y(Ctil[k2]).toFixed(1)+' ';
      el(s,'path',{d:d2,fill:'none',stroke:COB,'stroke-width':3.5,'stroke-dasharray':'10 7'});
      txt(s, XK(150,KMAX), Y(Ctil[150])+50, 'masked  C̃(k)', {fill:COB});
    }
    if(opts.binned) for(var b2=0;b2<NBIN;b2++){
      var kc = binCentre(b2);
      if(kc < 8 || kc > KMAX-14) continue;
      el(s,'rect',{x:XK(kc,KMAX)-7,y:Y(Ctilb[b2])-7,width:14,height:14,fill:COB});
    }
    if(opts.decoupled) for(var b3=0;b3<NBIN;b3++){
      var kc3 = binCentre(b3);
      if(kc3 < 8 || kc3 > KMAX-14) continue;
      if(!isFinite(Cdecb[b3]) || Cdecb[b3] <= 0) continue;
      el(s,'circle',{cx:XK(kc3,KMAX),cy:Y(Cdecb[b3]),r:9,fill:TEAL});
    }
    if(opts.kernel){
      var pk = 0, m;
      for(m=-N/2+1;m<N/2;m++) pk = Math.max(pk, kpow(m));
      var dk='';
      for(m=-N/2+1;m<N/2;m++){
        var kk2 = K0 - m; if(kk2 < 0.5 || kk2 > KMAX) continue;
        dk += (dk?'L':'M')+XK(kk2,KMAX).toFixed(1)+' '+(y0+h - (opts.kh||150)*kpow(m)/pk).toFixed(1)+' ';
      }
      var hw = mixRadius(kpow, N/2-1);
      var lo = Math.max(K0-hw,1), hi = Math.min(K0+hw,KMAX-1);
      el(s,'rect',{x:XK(lo,KMAX),y:y0,width:Math.max(XK(hi,KMAX)-XK(lo,KMAX),3),height:h,
                   fill:COB,opacity:0.10});
      el(s,'path',{d:dk,fill:'none',stroke:COB,'stroke-width':3.5});
      // the ± n bar, on the kernel itself, with one name for the concept
      el(s,'line',{x1:XK(lo,KMAX),y1:y0+h+26,x2:XK(hi,KMAX),y2:y0+h+26,
                   stroke:COB,'stroke-width':8,'stroke-linecap':'round'});
      txt(s, XK(hi,KMAX)+18, y0+h+36, pmLabel(hw), {fill:COB,'font-size':29});
      var lx = PAD + AW - 790;
      txt(s, lx, y0+26, 'kernel  |W|²  at  k₀ = '+K0, {fill:COB});
      txt(s, lx, y0+64, WIDTH_CAPTION, {fill:MUT,'font-size':26});
      if(opts.err === true){
        var v = pullOutError(K0);
        txt(s, lx, y0+102, 'C at k₀ vs its kernel average:  '+pct(v),
            {fill: Math.abs(v)>0.05 ? ACC : COB});
      }
    }
  }

  // ---------- covariance matrices ----------
  function divergent(v){                       // ground -> cobalt / cinnabar
    var t = Math.max(-1, Math.min(1, v));
    if(t >= 0){ var u = Math.pow(t,0.55); return [247-186*u, 240-149*u, 225-65*u]; }
    var u2 = Math.pow(-t,0.55); return [247-59*u2, 240-171*u2, 225-169*u2];
  }
  function heat(cv, mat, scale){
    cv.width = NK; cv.height = NK;
    var ctx = cv.getContext('2d'), im = ctx.createImageData(NK,NK);
    for(var i=0;i<NK;i++) for(var j=0;j<NK;j++){
      var c = divergent(mat[i*NK+j]/scale), o = 4*(i*NK+j);
      im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=255;
    }
    ctx.putImageData(im,0,0);
  }
  //  Shown as correlation matrices, Cov / sqrt(diag diag), so the band stays
  //  visible at every k instead of being swamped by C(k)^2.
  function drawMatrices(root){
    var cvs = root.querySelectorAll('canvas');
    if(cvs.length < 3) return;
    var rE=new Float64Array(NK*NK), rN=new Float64Array(NK*NK), rD=new Float64Array(NK*NK),
        d=new Float64Array(NK);
    for(var i=0;i<NK;i++) d[i] = Math.sqrt(covE[i*NK+i]);
    for(var a=0;a<NK;a++) for(var b=0;b<NK;b++){
      var q=a*NK+b, nrm=d[a]*d[b];
      rE[q]=covE[q]/nrm; rN[q]=covN[q]/nrm; rD[q]=rN[q]-rE[q];
    }
    heat(cvs[0], rE, 1); heat(cvs[1], rN, 1); heat(cvs[2], rD, 0.35);
  }

  // ═══ catalogue masks (the Wolz act) ═══════════════════════════════════════
  //  A catalogue's mask IS its sources: w(x) = sum_i w_i delta(x - x_i). There is
  //  no separate footprint map, which is exactly what breaks the machinery above.
  var NSRC = 160, THC = 0.0;          // sources, and the cloud size in units of L
  var CATSEED = 90210;

  function catPositions(n, seed){
    var rng = mulberry(seed || CATSEED), xs = [];
    for(var i=0;i<n;i++) xs.push(rng());
    xs.sort(function(a,b){ return a-b; });
    return xs;
  }
  //  On the grid: unit mean, so the delta comb is comparable with a continuous
  //  mask. A cloud of size thc simply band-limits it.
  function catGrid(xs, thc){
    var w = new Float64Array(NX), amp = NX/xs.length;
    if(thc <= 0){
      for(var i=0;i<xs.length;i++) w[Math.min(NX-1, Math.floor(xs[i]*NX))] += amp;
    } else {
      var sg = thc*NX, half = Math.ceil(4*sg), norm = amp/(Math.sqrt(2*Math.PI)*sg);
      for(var i2=0;i2<xs.length;i2++){
        var c = xs[i2]*NX;
        for(var d=-half; d<=half; d++){
          var j = Math.round(c+d); j = ((j % NX) + NX) % NX;
          w[j] += norm*Math.exp(-0.5*d*d/(sg*sg));
        }
      }
    }
    return w;
  }
  var CAT = {xs:null, n:0, thc:-1, W:null};
  function catBuild(){
    if(CAT.n !== NSRC) CAT.xs = catPositions(NSRC);
    if(CAT.n !== NSRC || CAT.thc !== THC){
      CAT.n = NSRC; CAT.thc = THC;
      CAT.W = transform(catGrid(CAT.xs, THC));
    }
    return CAT;
  }
  function catKpow(m){
    var i = (m + N) % N;
    return CAT.W.re[i]*CAT.W.re[i] + CAT.W.im[i]*CAT.W.im[i];
  }

  //  W1 — the sources are the mask
  function drawCatalogue(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 34, h = opts.h || 250, mid = y0 + h/2;
    catBuild();
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    var d='';
    for(var j=0;j<NX;j++) d += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(mid-field[j]*h*0.42).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:FAINT,'stroke-width':2});
    txt(s, Math.max(PAD-82,2), mid+9, 'a(x)', {fill:MUT});
    // the sources: sampled values of the field
    for(var i=0;i<CAT.xs.length;i++){
      var xg = Math.min(NX-1, Math.floor(CAT.xs[i]*NX)), v = field[xg];
      var X = PAD + AW*CAT.xs[i], Y = mid - v*h*0.42;
      el(s,'circle',{cx:X,cy:Y,r:3.2+5*Math.abs(v),fill:INK,opacity:0.85});
    }
    // the same sources, as the mask: a comb of deltas
    var by = y0 + h + 96;
    el(s,'line',{x1:PAD,y1:by,x2:PAD+AW,y2:by,stroke:RULE,'stroke-width':2});
    for(var i2=0;i2<CAT.xs.length;i2++){
      var X2 = PAD + AW*CAT.xs[i2];
      el(s,'line',{x1:X2,y1:by,x2:X2,y2:by-70,stroke:COB,'stroke-width':2.5});
      el(s,'circle',{cx:X2,cy:by-70,r:4,fill:COB});
    }
    txt(s, Math.max(PAD-82,2), by+9, 'w(x)', {fill:COB});
    txt(s, PAD+AW-360, y0+18, CAT.xs.length + ' sources', {fill:MUT});

    //  the cloud scale, on the toy: the gap between two neighbouring sources.
    //  It is the scale the next slide smears each delta over.
    var mid = CAT.xs.length >> 1, best = mid;
    for(var q=Math.max(1,mid-12); q<Math.min(CAT.xs.length,mid+12); q++)
      if(CAT.xs[q]-CAT.xs[q-1] > CAT.xs[best]-CAT.xs[best-1]) best = q;
    var xL = PAD + AW*CAT.xs[best-1], xR = PAD + AW*CAT.xs[best], yb2 = by + 30;
    el(s,'line',{x1:xL,y1:yb2,x2:xR,y2:yb2,stroke:TEAL,'stroke-width':4,'stroke-linecap':'round'});
    el(s,'line',{x1:xL,y1:yb2-9,x2:xL,y2:yb2+9,stroke:TEAL,'stroke-width':3});
    el(s,'line',{x1:xR,y1:yb2-9,x2:xR,y2:yb2+9,stroke:TEAL,'stroke-width':3});
    txtsub(s, xR+16, yb2+9, 'θ', 'c', '  ≈  source spacing', {fill:TEAL,'font-size':26});
    txt(s, PAD, by+58, 'position  x', {fill:MUT});
  }

  //  the catalogue mask's kernel: flat and ratty. The mask is itself a catalogue,
  //  so its own spectrum carries a white floor from its self-pairs — Nw = sum
  //  w_i^2 / 4pi — that never decays. The kernel is built from that spectrum, so
  //  it inherits the floor: flat forever, no scale anywhere.
  function drawCatKernel(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 44, h = opts.h || 210, MM = 120;
    catBuild();
    var pk = 0, p = [], m, floor = 0, nf = 0;
    for(m=-MM;m<=MM;m++){ var v = catKpow(m); p.push(v); if(v>pk) pk=v;
                          if(Math.abs(m) > 6){ floor += v; nf++; } }
    floor = nf ? floor/nf : 0;
    function Y(v){ return y0 + h - (Math.log10(Math.max(v/pk,1e-6))/6 + 1)*h; }
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    var d='';
    for(var q=0;q<p.length;q++)
      d += (q?'L':'M')+(PAD+AW*q/(p.length-1)).toFixed(1)+' '+Y(p[q]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:ACC,'stroke-width':2.5,opacity:0.75});
    // the floor it rattles around
    el(s,'line',{x1:PAD,y1:Y(floor),x2:PAD+AW,y2:Y(floor),stroke:INK,
                 'stroke-width':3,'stroke-dasharray':'12 8'});
    // clear of the curve, which rattles about half a decade either side
    txt(s, PAD, Y(floor)-40, 'the mask\u2019s own white floor', {fill:INK,'font-size':27});
    txt(s, PAD, y0-16, 'kernel  |W|²   (log)', {fill:ACC});
    // the axis is mode separation, so mark its origin
    var cx = PAD + AW/2;
    el(s,'line',{x1:cx,y1:y0+h,x2:cx,y2:y0+h+12,stroke:RULE,'stroke-width':2.5});
    txt(s, cx-34, y0+h+40, 'Δk = 0', {fill:MUT,'font-size':26});
    txt(s, PAD, y0+h+78, opts.foot || 'mode separation Δk — the kernel never narrows',
        {fill:MUT,'font-size':26});
  }

  //  W2 — the product that breaks. Two catalogues never coincide, so their mask
  //  product is zero everywhere; the auto case is the opposite failure and gets
  //  a three-word trace rather than a panel of its own.
  function drawProducts(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var xa = catPositions(Math.round(NSRC*0.5), 111), xc = catPositions(Math.round(NSRC*0.5), 222);
    var yA = 120, yB = 240, yP = 348;
    function comb(xs, y, col){
      el(s,'line',{x1:PAD,y1:y,x2:PAD+AW,y2:y,stroke:RULE,'stroke-width':2});
      for(var i=0;i<xs.length;i++){
        var X = PAD + AW*xs[i];
        el(s,'line',{x1:X,y1:y,x2:X,y2:y-58,stroke:col,'stroke-width':2.5});
      }
    }
    comb(xa, yA, COB);   txt(s, PAD, yA+34, 'catalogue a', {fill:COB,'font-size':27});
    comb(xc, yB, TEAL);  txt(s, PAD, yB+34, 'catalogue c', {fill:TEAL,'font-size':27});
    el(s,'line',{x1:PAD,y1:yP,x2:PAD+AW,y2:yP,stroke:RULE,'stroke-width':3});
    txt(s, PAD, yP+46, 'their product', {fill:INK,'font-size':27});
    txt(s, PAD+AW/2-130, yP-18, 'zero, everywhere', {fill:ACC,'font-size':30});
    // the auto case, in passing
    txt(s, PAD+AW-340, yP+46, 'same catalogue:', {fill:MUT,'font-size':27});
    txt(s, PAD+AW-124, yP+58, '\u221e', {fill:ACC,'font-size':50});
  }

  //  W2 — the fix: each source becomes a cloud, and the mask band-limits
  function drawCloud(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 40, h = opts.h || 150;
    catBuild();
    var w = catGrid(CAT.xs, THC), mx = 0, j;
    for(j=0;j<NX;j++) mx = Math.max(mx, w[j]);
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    var d = 'M ' + PAD + ' ' + (y0+h);
    for(j=0;j<NX;j++) d += ' L ' + (PAD+AW*j/(NX-1)).toFixed(1) + ' ' + (y0+h-w[j]/mx*h).toFixed(1);
    d += ' L ' + (PAD+AW) + ' ' + (y0+h) + ' Z';
    el(s,'path',{d:d,fill:COB,opacity:0.16});
    var d2='';
    for(j=0;j<NX;j++) d2 += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(y0+h-w[j]/mx*h).toFixed(1)+' ';
    el(s,'path',{d:d2,fill:'none',stroke:COB,'stroke-width':2.5});
    txt(s, Math.max(PAD-82,2), y0+h*0.5, 'w̄(x)', {fill:COB});
    var ip = 1/CAT.xs.length;
    txt(s, PAD, y0+h+44,
        'cloud size = ' + (THC/ip).toFixed(2) + ' × the mean source spacing',
        {fill: (THC/ip > 0.6 && THC/ip < 1.8) ? TEAL : MUT, 'font-size':27});
  }

  //  W3 — the correlation-function view: distinct pairs vs the self-pair spike
  function drawXi(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 40, h = opts.h || 260, NT = 90;
    var xi = [], var0 = 0, k;
    for(k=1;k<KMAX;k++) var0 += 2*Cfun(k);
    for(var t=0;t<NT;t++){
      var th = t/(NT-1)*0.075, acc = 0;
      for(k=1;k<KMAX;k++) acc += 2*Cfun(k)*Math.cos(2*Math.PI*k*th);
      xi.push(acc);
    }
    var mx = var0;
    function Y(v){ return y0 + h*(1 - 0.86*v/mx) - h*0.07; }
    el(s,'line',{x1:PAD,y1:Y(0),x2:PAD+AW,y2:Y(0),stroke:RULE,'stroke-width':2});
    var d='';
    for(var t2=1;t2<NT;t2++) d += (t2>1?'L':'M')+(PAD+AW*t2/(NT-1)).toFixed(1)+' '+Y(xi[t2]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    txt(s, PAD+AW*0.30, Y(xi[20])-30, 'distinct pairs  ξ(θ)', {fill:INK});
    // the self-pair spike at zero lag
    el(s,'line',{x1:PAD,y1:Y(0),x2:PAD,y2:Y(var0),stroke:ACC,'stroke-width':7,'stroke-linecap':'round'});
    el(s,'circle',{cx:PAD,cy:Y(var0),r:9,fill:ACC});
    txt(s, PAD+22, Y(var0)+10, 'self-pairs at zero separation:  ⟨a²⟩', {fill:ACC});
    txt(s, Math.max(PAD-82,2), Y(0)+9, 'ξ', {fill:MUT});
    txt(s, PAD, y0+h+44, 'separation  θ', {fill:MUT});
  }
  //  W3 — and in harmonic space it is a flat line
  function drawWhite(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 30, h = opts.h || 260, Y = logY(y0,h,KMAX);
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    txt(s, Math.max(PAD-86,2), y0+18, 'C(k)', {fill:MUT});
    txt(s, PAD, y0+h+44, 'wavenumber  k', {fill:MUT});
    var d='';
    for(var k=1;k<KMAX;k++) d += (k>1?'L':'M')+XK(k,KMAX).toFixed(1)+' '+Y(Cfun(k)).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    txt(s, XK(150,KMAX), Y(Cfun(150))-26, 'signal  C(k)', {fill:INK});
    // white level: the self-pair variance shared over the modes of the sample
    var var0 = 0;
    for(var k2=1;k2<KMAX;k2++) var0 += 2*Cfun(k2);
    var wl = var0/NSRC;
    el(s,'line',{x1:PAD,y1:Y(wl),x2:PAD+AW,y2:Y(wl),stroke:ACC,'stroke-width':3.5});
    txt(s, XK(150,KMAX), Y(wl)-26, 'self-pairs: flat, at every k', {fill:ACC});
  }

  // ---------- the equation ledger ----------
  //  Built here rather than pasted into every slide, so the sequence can only be
  //  defined once. MathJax has already run by now, so it is asked to typeset.
  //  [latex, the step it appears on, the name a person would say for it]
  //  The ledger is a grid, and the grid is the argument: row 1 is the unmasked
  //  field, row 2 is what the mask does to it — each masked object sitting
  //  directly under its unmasked twin — and row 3 is how you undo it.
  //  {tex, step it appears on, name, column, row, optional note, optional span}
  var EQS = [
    {tex:'a(x)', step:0, name:'field', col:1, row:1},
    {tex:'a_k=\\sum_x a(x)\\,e^{-ikx}', step:1, name:'Fourier transform', col:2, row:1},
    {tex:'a(x)=\\sum_k a_k\\,e^{+ikx}', step:1, name:'inverse', col:3, row:1},
    {tex:'C(k)=\\langle |a_k|^2\\rangle', step:1, name:'power spectrum', col:4, row:1},

    {tex:'\\tilde a(x)=w(x)\\,a(x)', step:2, name:'mask', col:1, row:2, sub:0},
    {tex:'\\tilde a_k=\\sum_{k\'} W_{k-k\'}\\,a_{k\'}', step:2, name:'mode coupling', col:2, row:2, sub:1},
    {tex:'\\langle \\tilde C(k)\\rangle=\\sum_{k\'} M_{kk\'}\\,C(k\')', step:2, name:'pseudo-C(k)', col:4, row:2, sub:2},

    {tex:'\\tilde C_b=\\frac{1}{N_b}\\sum_{k\\in b}\\tilde C(k)', step:3, name:'bandpower', col:1, row:3},
    {tex:'M_{bb\'}=\\frac{1}{N_b}\\sum_{k\\in b}\\sum_{k\'\\in b\'} M_{kk\'}', step:3, name:'binned coupling', col:2, row:3},
    {tex:'\\hat C_b=(M_{bb\'})^{-1}\\,\\tilde C_{b\'}', step:3, name:'decoupled', col:3, row:3},

    {tex:'{\\rm Cov}\\big(\\tilde C(k),\\tilde C(k\')\\big)\\propto\\Big|\\sum_{k\'\'} W_{k-k\'\'}\\,W^{*}_{k\'-k\'\'}\\,C(k\'\')\\Big|^{2}',
     step:4, name:'four-point', col:1, row:1, span:2,
     note:'one sum over k″ for every element of the k, k′ matrix'},
    {tex:'{\\rm Cov}\\simeq C(\\bar k)\\,C(\\bar k)\\,\\Xi_{kk\'}(w_aw_c,\\,w_bw_d)',
     step:5, name:'narrow-kernel approximation', col:3, row:1, span:2,
     note:'Ξ: the same coupling coefficients as the estimator, built from the product of the masks'},
    {tex:'\\tilde a(x)=\\sum_i w_i\\,a_i\\,\\delta(x-x_i)', step:6, name:'catalogue field', col:1, row:1, span:2},
    {tex:'w(x)=\\sum_i w_i\\,\\delta(x-x_i)', step:6, name:'catalogue mask', col:3, row:1, span:2},
    {tex:'\\langle a^2\\rangle=\\textstyle\\int C(k)\\,dk', step:8, name:'self-pair variance', col:1, row:1, span:2}
  ];
  function ledger(host, step, from, stage){
    from = from || 0;
    if(stage == null) stage = Infinity;
    var html = '';
    for(var i=0;i<EQS.length;i++){
      var e = EQS[i];
      if(e.step > step || e.step < from) continue;
      var live = (e.step === step) && (e.sub == null || e.sub === stage);
      html += '<div class="' + (live?'on':'') + '" style="grid-column:' + e.col +
              (e.span ? ' / span ' + e.span : '') + ';grid-row:' + e.row + '">' +
              '<span class="nm">' + e.name + '</span>' +
              '<span class="eq">\\(' + e.tex + '\\)</span>' +
              (e.note ? '<span class="note">' + e.note + '</span>' : '') +
              '</div>';
    }
    host.innerHTML = html;
  }

  // ---------- mask picker ----------
  function picker(host){
    host.innerHTML = '';
    for(var i=0;i<MASKS.length;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = MASKS[i].name;
        b.className = (i === pick) ? 'on' : '';
        b.onclick = function(){ pick = i; buildAll(); renderAll(); };
        host.appendChild(b);
      })(i);
    }
  }

  // ---------- render one slide ----------
  //  The approximation, said once in words where it is introduced.
  var SAY_NKA = 'assume the kernel is narrow compared to the features of C(k) — ' +
                'then C barely varies across it, and comes out of the sum';
  var COST = {4:'<i>O</i>(k<sub>max</sub><sup>6</sup>)',
              5:'<i>O</i>(k<sub>max</sub><sup>3</sup>) — same as the estimator'};
  //  A slide may advance its ledger with a reveal fragment: data-frag-step is the
  //  step it moves to once any fragment on the slide is showing. Used by the
  //  covariance slide to stage exact -> NKA -> error.
  //  A staged slide reveals its panels one fragment at a time; stage 0 is the
  //  base state. Unstaged slides are "everything on".
  function stageOf(root){
    if(!root.dataset.staged) return Infinity;
    if(!(window.Reveal && Reveal.getIndices)) return 0;
    var f = Reveal.getIndices().f;
    return (typeof f === 'number' && f >= 0) ? f + 1 : 0;
  }
  function effectiveStep(root){
    var base = +root.getAttribute('data-step');
    var fs = root.getAttribute('data-frag-step');
    if(fs && window.Reveal && Reveal.getIndices){
      var f = Reveal.getIndices().f;
      if(typeof f === 'number' && f >= 0) return +fs;
    }
    return base;
  }
  function renderOne(root){
    var step = effectiveStep(root), stage = stageOf(root);
    var q = function(sel){ return root.querySelector(sel); };
    // On the build slide the animation owns the ledger (it reveals the relations
    // at the last beat), so renderOne must not overwrite it.
    var eqs = q('.eqs');
    if(eqs) ledger(eqs, step, +root.dataset.ledgerFrom || 0, stage);
    // .saywhat is auto-filled only where the script owns the words (the NKA
    // slide); slides that hard-code their own line keep it.
    var say = q('.saywhat');
    if(say && !say.dataset.own) say.textContent = (step === 5) ? SAY_NKA : '';
    var cost = q('.cost');
    if(cost) cost.innerHTML = COST[step] || '';
    // reserve the top-right for the cost label so the ledger cannot wrap under it
    root.classList.toggle('has-cost', !!COST[step]);
    var pk = q('.pick'); if(pk) picker(pk);

    var pA = q('.pA');
    if(pA) drawField(pA, {h: +pA.dataset.h || 200, mask: step >= 2 && stage >= 0,
                          x0: +pA.dataset.x0 || undefined, w: +pA.dataset.w || undefined});
    var pM = q('.pM');
    if(pM){
      if(!pM.__cine){
        buildCine(pM);
        //  Rest at beat 0 (empty). Painting the finished picture here and then
        //  wiping it to start the build is exactly the flash you see on entry.
        //  A print export has no animation, so give it the finished state.
        setBeat(root, pM, PRINT ? MODES.length + 1 : 0);
      }
      var rb = root.querySelector('.replay');
      if(rb) rb.onclick = function(){ playCine(root, pM); };
    }
    var pK = q('.pK');
    if(pK) drawKernelPanel(pK, {h: +pK.dataset.h || 200,
                                x0: +pK.dataset.x0 || undefined, w: +pK.dataset.w || undefined});
    var pC = q('.pC');
    if(pC) drawSpectrum(pC, {
      h: +pC.dataset.h || 260,
      x0: +pC.dataset.x0 || undefined,
      w:  +pC.dataset.w  || undefined,
      marks: pC.dataset.marks === '1',
      kernel: pC.dataset.kernel === '1' && stage >= (+pC.dataset.kernelAt || 0),
      kh: +pC.dataset.kh || 150,
      err: pC.dataset.err === '1',
      tilde: pC.dataset.tilde === '1' && stage >= (+pC.dataset.tildeAt || 0),
      bins: pC.dataset.bins === '1',
      binned: pC.dataset.binned === '1',
      decoupled: pC.dataset.decoupled === '1',
      label: pC.dataset.label !== '0',
      xlabel: pC.dataset.xlabel !== '0'
    });
    var each = function(sel, fn){ var e = q(sel); if(e) fn(e, {
      h: +e.dataset.h || undefined, x0: +e.dataset.x0 || undefined,
      w: +e.dataset.w || undefined, foot: e.dataset.foot || undefined }); };
    each('.pP',    drawCatalogue);
    each('.pKC',   drawCatKernel);
    each('.pProd', drawProducts);
    each('.pCloud',drawCloud);
    each('.pXi',   drawXi);
    each('.pWhite',drawWhite);
    var sl = root.querySelectorAll('input[type=range]');
    for(var si=0; si<sl.length; si++) (function(inp){
      if(inp.__wired) return; inp.__wired = 1;
      inp.oninput = function(){
        if(inp.dataset.var === 'N') NSRC = +inp.value;
        if(inp.dataset.var === 'thc') THC = (+inp.value)/10000;
        var lab = inp.parentNode.querySelector('.val');
        if(lab) lab.textContent = inp.dataset.var === 'N'
          ? inp.value + ' sources'
          : 'θ_c';
        renderOne(root); typeset();
      };
    })(sl[si]);
    if(q('canvas')) drawMatrices(root);
  }
  // MathJax is loaded async from a CDN and may not have started when this runs,
  // so wait on its startup promise; retry until it exists.
  function typeset(){
    if(window.MathJax && MathJax.startup && MathJax.startup.promise)
      MathJax.startup.promise.then(function(){ return MathJax.typesetPromise(); })
                             .catch(function(){});
    else if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    else setTimeout(typeset, 150);
  }
  function renderAll(){
    for(var i=0;i<ROOTS.length;i++) renderOne(ROOTS[i]);
    typeset();
  }

  buildAll();
  renderAll();
  // reveal only lays a slide out when it becomes current; redraw then, cheaply
  (function attach(){
    if(!(window.Reveal && Reveal.on && typeof Reveal.getIndices === 'function')){
      setTimeout(attach, 150); return;
    }
    // A slide that stages itself with fragments re-renders its ledger and cost
    // label as they come and go (the covariance slide: four-point -> NKA).
    function refresh(){
      var st0 = document.querySelector('.present .nka[data-staged]');
      if(st0){ renderOne(st0); typeset(); }
      var r = document.querySelector('.present .nka[data-frag-step]');
      if(!r) return;
      var st = effectiveStep(r);
      var eqs = r.querySelector('.eqs');
      if(eqs) ledger(eqs, st, +r.dataset.ledgerFrom || 0);
      var say = r.querySelector('.saywhat');
      if(say && !say.dataset.own) say.textContent = (st === 5) ? SAY_NKA : '';
      var cost = r.querySelector('.cost');
      if(cost){ cost.innerHTML = COST[st] || ''; }
      r.classList.toggle('has-cost', !!COST[st]);
      typeset();
    }
    Reveal.on('fragmentshown',  refresh);
    Reveal.on('fragmenthidden', refresh);
    Reveal.on('slidechanged', function(ev){
      var r = ev.currentSlide && ev.currentSlide.querySelector('.nka[data-step]');
      if(!r) return;
      renderOne(r); typeset();
      var cine = r.querySelector('.pM');
      if(cine && cine.__cine) playCine(r, cine);
    });
  })();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
