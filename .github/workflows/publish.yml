name: Publish to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install house deck dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm ci

      - name: Test the checker, then check every house deck
        run: |
          npm test
          node house/check.mjs --all

      - name: Unpack the frozen Quarto site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frozen-quarto-site -p frozen-quarto-site.tar.gz
          mkdir -p _site && tar -xzf frozen-quarto-site.tar.gz -C _site && rm frozen-quarto-site.tar.gz

      - name: Build house decks
        run: node house/build.mjs --all --out _site --web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
