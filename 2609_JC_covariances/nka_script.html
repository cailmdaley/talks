<script>
// ═══════════════════════════════════════════════════════════════════════════
//  HANDOFF — the engine behind the CosmoStat JC covariance deck
//  (2609_JC_covariances). Read this before changing anything here.
//
//  WHAT THIS IS
//  One script drives every animated slide. Each slide carries a container
//      <div class="nka" data-step="N"> … </div>
//  holding only the panels that step needs. This file fills every container
//  once at load, and re-fills the mask-dependent ones when the picker changes.
//  It is pulled in through `include-after-body` in the qmd, so it runs after
//  every slide has been parsed — do NOT move it into a slide's html block.
//
//  DELIVERY FLOW (do all four, in order)
//    1. cd ~/Documents/projects/talks
//    2. quarto render 2609_JC_covariances/2609_JC_covariances.qmd \
//         -M embed-resources:true          # sibling assets do not resolve in
//                                          # Cail's viewer; must be self-contained
//    3. cp _site/2609_JC_covariances/index.html \
//         ~/loom/.felt/work/talks/2609-jc-covariances/deck.html
//    4. screenshot the LOOM COPY, not the _site build, and look at the images.
//
//  QA LOOP — three checks, all of which have caught real bugs
//    a) node --check <(sed -n '/^<script>/,/^<\/script>/p' nka_script.html \
//                      | sed '1d;$d')
//       Splicing this file by string index has twice deleted a function or left
//       a duplicated tail, which blanks every slide. Run this after every edit.
//    b) puppeteer + a console/pageerror listener. A blank panel is usually a
//       ReferenceError, not a layout problem. (`Cannot read … 'Config'` on load
//       comes from the shared MathJax asset and is harmless.)
//    c) OVERFLOW must be measured in SLIDE coordinates, not viewport pixels.
//       Reveal scales the 1920x1080 stage (≈0.9 here) and centres it, so a
//       getBoundingClientRect().bottom of 1005 can be 1057 on the slide. Walk
//       the DOM summing offsetTop to the section and compare against 1080 (the
//       slide box; the footer sits at ≈1090). Keep content ≤ ~990 for margin.
//
//  ARCHITECTURE
//  · data-step  — which point in the argument the slide is at. Drives which
//                 ledger entries exist and which cost label shows.
//  · EQS        — the ledger, one array, rendered as a CSS grid. Each entry is
//                 {tex, step, name, col, row, span?, note?, sub?}. The GRID IS
//                 THE ARGUMENT: row 1 is the unmasked field, row 2 is what the
//                 mask does with each masked object directly under its unmasked
//                 twin, row 3 is how you undo it. Do not reflow it casually.
//                 `sub` lights one entry per fragment on a staged slide.
//                 data-ledger-from makes a slide start a fresh ledger (the
//                 covariance and Wolz slides do).
//  · data-staged — the slide reveals its own panels with reveal fragments;
//                 stageOf() turns the fragment index into a stage number that
//                 the panel options and ledger `sub` read. Used by slide 3
//                 (the click-driven mode build below) and slide 4.
//  · data-frag-step — simpler variant: the slide's step advances by one once
//                 any fragment shows (the covariance slide: four-point → NKA).
//  · cine       — the "modes" build on slide 3. Elements are created ONCE by
//                 buildModes() and only their opacity changes, so the CSS
//                 transitions actually run. setModeBeat(n) is the whole state
//                 machine, n = stageOf(root) = how many mode-pairs have been
//                 clicked in (0..5) — a pure function of n, so ArrowLeft
//                 exactly undoes ArrowRight. No timer, no autoplay. The true
//                 C(k) curve is drawn from the start; each click's dot lands
//                 visibly ON that pre-drawn curve, which is what used to take
//                 a "sum snaps to field" animation to show.
//  · picker / NSRC / THC — module-level globals, deliberately shared across
//                 slides: one mask and one catalogue run through the whole
//                 deck, so changing sources on W1 is visible on W2 and W3.
//                 buildAll() recomputes everything; renderAll() redraws.
//  · panels     — a slide asks for panels by class: .pA field, .pM cine,
//                 .pC spectrum, .pZ zoo (unused now), .pP catalogue,
//                 .pKC catalogue kernel, .pProd mask products, .pCloud clouds,
//                 .pXi correlation function, .pWhite white floor, plus canvases
//                 for the covariance matrices. Options come from data-* on the
//                 element; geom() lets a panel take a sub-width so panels can
//                 sit in columns.
//
//  TWO GOTCHAS THAT WILL BITE
//  · Reveal is NOT ready when this file runs. attach() polls until
//    Reveal.on/getIndices exist. Registering listeners unguarded silently does
//    nothing — the fragments advance and the drawing never changes.
//  · MathJax is loaded async and has already typeset the page by the time any
//    ledger is injected. Every path that rewrites .eqs innerHTML must call
//    typeset() afterwards — including the slider handlers. Missing it shows raw
//    \( … \) on the slide.
//
//  PHYSICS NOTES worth keeping
//  · Kernel width is quoted as a RADIUS: "± n modes", n = mixRadius(), the
//    half-width holding half the OFF-diagonal coupling power. The m = 0 self
//    term dominates |W|² for any mask, so counting it makes every mask look
//    narrow. Same words and same definition on every slide.
//  · The NKA readout is pullOutError(): C at the midpoint divided by the
//    kernel-weighted mean of C. That is exactly what the approximation does.
//    max/min across the kernel is WRONG at a local extremum — on the bump peak
//    it read ×1.1 while the covariance error was +25%.
//  · Decoupling is done in BANDPOWERS. The unbinned coupling matrix is not
//    invertible in any useful sense (its Toeplitz symbol is the mask squared,
//    so every mode the mask kills is a null direction) — the first attempt
//    returned NaN. Binning to about the kernel width is what NaMaster does.
//
//  ELSEWHERE
//  · The 1D toy that backs slides 3–5 and the parked Nagura slides lives in
//    notes/projection_experiment.py, written up in notes/projection-experiment.md.
//  · Three parked slides sit at the end of the qmd behind reveal's
//    visibility="hidden"; their data ships in nka_data.html. Delete one
//    attribute to bring each back.
// ═══════════════════════════════════════════════════════════════════════════
(function(){
"use strict";
function boot(){
  var ROOTS = document.querySelectorAll('.nka[data-step]');
  if(!ROOTS.length) return;

  // ---------- config ----------
  var N = 512, NX = 1024;          // modes, real-space samples
  var KLO = 6, KHI = 156, NK = KHI - KLO;   // covariance matrix range
  var KMAX = 250;                  // modes drawn in the harmonic panels
  var K0 = 84;                     // where the kernel sits: on the bump's flank,
                                   // where the NKA is visibly wrong but not absurd
  var NB = 12;                     // bandpower width, ~ the kernel width
  var MODES = [4, 12, 30, 78, 150];   // the modes that build the field, low k to high

  var INK='#1B1611', MUT='#7A6F5C', ACC='#BC4538', COB='#3D5BA0',
      TEAL='#3F8278', RULE='#C5B89E', FAINT='#C5B89E', GRID='#E0D5BF';

  //  grey -> blue by the local mask value, for the source dots on the
  //  catalogue slides: a source at the apodised edge is half-observed and is
  //  drawn half-way between the two colours.
  function mixHex(a, b, t){
    t = Math.max(0, Math.min(1, t));
    function ch(h, i){ return parseInt(h.substr(1 + 2*i, 2), 16); }
    var r = Math.round(ch(a,0) + t*(ch(b,0)-ch(a,0))),
        g = Math.round(ch(a,1) + t*(ch(b,1)-ch(a,1))),
        bl= Math.round(ch(a,2) + t*(ch(b,2)-ch(a,2)));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // A pronounced bump gives two regimes: the smooth part, where the NKA holds,
  // and the bump, where it does not.
  function Cfun(k){ var a = Math.abs(k);
    return (1.0/Math.pow(1.0 + a/18.0, 1.6)) * (1 + 2.5*Math.exp(-Math.pow((a-78)/6,2))); }

  function mulberry(a){ return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(rng){ var u = 1 - rng(), v = rng();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

  // ---------- one realisation of the field, and its modes ----------
  var field = new Float64Array(NX), fscale = 1;
  var modeRe = {}, modeIm = {};
  (function(){
    var rng = mulberry(20260903), re = {}, im = {};
    for(var k=1;k<N/2;k++){
      var s = Math.sqrt(Cfun(k)/2);
      re[k] = gauss(rng)*s; im[k] = gauss(rng)*s;
      for(var j=0;j<NX;j++){
        var ph = 2*Math.PI*k*j/NX;
        field[j] += 2*(re[k]*Math.cos(ph) - im[k]*Math.sin(ph));
      }
    }
    var mx = 0; for(var j2=0;j2<NX;j2++) mx = Math.max(mx, Math.abs(field[j2]));
    fscale = mx;
    for(var j3=0;j3<NX;j3++) field[j3] /= mx;
    for(var q=0;q<MODES.length;q++){ modeRe[MODES[q]] = re[MODES[q]]/mx; modeIm[MODES[q]] = im[MODES[q]]/mx; }
  })();
  function modeAt(k, j){
    var ph = 2*Math.PI*k*j/NX;
    return 2*(modeRe[k]*Math.cos(ph) - modeIm[k]*Math.sin(ph));
  }

  // ---------- masks ----------
  function ramp(t){ return 0.5*(1 - Math.cos(Math.PI*Math.max(0,Math.min(1,t)))); }
  function makeMask(width, nholes, apod){
    var w = new Float64Array(NX), ap = Math.max(apod*NX, 1);
    var half = width*NX/2, mid = NX/2;
    for(var j=0;j<NX;j++) w[j] = ramp((half - Math.abs(j-mid))/ap + 0.5);
    if(nholes > 0){
      var rng = mulberry(4242), inner = width*NX - 2*ap;
      for(var h=0; h<nholes; h++){
        var hw = Math.max(inner/(3.2*nholes), 2*ap*0.6);
        var c  = mid - inner/2 + (h + 0.15 + 0.7*rng())*inner/nholes;
        for(var j2=0;j2<NX;j2++) w[j2] *= 1 - ramp((hw/2 - Math.abs(j2-c))/ap + 0.5);
      }
    }
    return w;
  }
  var MASKS = [
    {w:0.55, h:0, a:0.070, name:'wide, smooth'},
    {w:0.16, h:0, a:0.030, name:'small'},
    {w:0.55, h:5, a:0.010, name:'holes'}
  ];
  var pick = 1;                    // the working mask

  // ---------- transforms ----------
  var COS = new Float64Array(NX), SIN = new Float64Array(NX);
  for(var t0=0;t0<NX;t0++){ COS[t0]=Math.cos(2*Math.PI*t0/NX); SIN[t0]=Math.sin(2*Math.PI*t0/NX); }
  function transform(w){
    var re = new Float64Array(N), im = new Float64Array(N), sp = 0;
    for(var mi=0; mi<N; mi++){
      var m = mi < N/2 ? mi : mi - N, sr = 0, si = 0;
      for(var jj=0; jj<NX; jj++){
        var idx = (m*jj) % NX; if(idx < 0) idx += NX;
        sr += w[jj]*COS[idx]; si -= w[jj]*SIN[idx];
      }
      re[mi] = sr/NX; im[mi] = si/NX;
      sp += re[mi]*re[mi] + im[mi]*im[mi];
    }
    return {re:re, im:im, sumP:sp};
  }

  var mask, Wre, Wim, sumP;
  function Wat(m, part){
    if(m <= -N/2 || m >= N/2) return 0;
    var i = (m + N) % N;
    return part ? Wim[i] : Wre[i];
  }
  function kpow(m){ var r = Wat(m,0), i = Wat(m,1); return r*r + i*i; }

  //   How many neighbours each mode mixes with: the half-width of the smallest
  //   symmetric window in |W_m|^2 holding half the OFF-diagonal coupling power.
  //   The m = 0 self term carries most of |W|^2 for any mask, so counting it makes
  //   every mask look narrow. Used only to size the shaded kernel-width rect now
  //   -- the "± n modes" label and caption that used to sit beside it were
  //   retired; the number is said in words instead.
  function mixRadius(pow, mmax){
    var tot = 0, m;
    for(m=1;m<=mmax;m++) tot += 2*pow(m);
    if(tot <= 0) return 1;
    var acc = 0, n = 0;
    while(acc < 0.5*tot && n < mmax){ n++; acc += pow(-n) + pow(n); }
    return Math.max(n, 1);
  }

  // ---------- derived ----------
  var Cin = new Float64Array(KMAX+2), Ctil = new Float64Array(KMAX+2);
  var covE = new Float64Array(NK*NK), covN = new Float64Array(NK*NK),
      covI = new Float64Array(NK*NK);   // iNKA, for the projection slide
  var MW2 = 1;                          // <w^2> over the grid
  var NBIN = Math.floor(KMAX/NB);
  var Cdecb = new Float64Array(NBIN), Ctilb = new Float64Array(NBIN);
  function binCentre(b){ return 1 + b*NB + (NB-1)/2; }

  function buildAll(){
    var M = MASKS[pick];
    mask = makeMask(M.w, M.h, M.a);
    var T = transform(mask); Wre = T.re; Wim = T.im; sumP = T.sumP;
    MW2 = 0; for(var mj=0;mj<NX;mj++) MW2 += mask[mj]*mask[mj]; MW2 /= NX;
    for(var k=1;k<=KMAX;k++){
      Cin[k] = Cfun(k);
      var acc = 0;
      for(var kp=-N/2; kp<N/2; kp++) acc += kpow(k-kp)*Cfun(kp);
      Ctil[k] = acc/sumP;
    }
    decouple();
    covariances();
    PROJ = null;
  }

  // Bandpowers. The unbinned coupling matrix is not invertible in any useful
  // sense — the symbol of the Toeplitz operator is the mask squared, so every
  // mode the mask kills is a null direction. Binning to about the kernel width
  // is what makes the inverse well posed, and it is what NaMaster does.
  function decouple(){
    var n = NBIN, A = new Float64Array(n*n), b = new Float64Array(n);
    for(var i=0;i<n;i++){
      for(var j=0;j<n;j++){
        var acc = 0;
        for(var k=0;k<NB;k++) for(var kp=0;kp<NB;kp++)
          acc += kpow((1+i*NB+k) - (1+j*NB+kp));
        A[i*n+j] = acc/(NB*sumP);
      }
      var st = 0;
      for(var k2=0;k2<NB;k2++) st += Ctil[1+i*NB+k2];
      b[i] = st/NB; Ctilb[i] = b[i];
    }
    for(var c=0;c<n;c++){
      var piv = c, best = Math.abs(A[c*n+c]);
      for(var r=c+1;r<n;r++){ var v = Math.abs(A[r*n+c]); if(v>best){best=v;piv=r;} }
      if(best < 1e-13){ for(var z=0;z<n;z++) Cdecb[z] = NaN; return; }
      if(piv !== c){
        for(var q=0;q<n;q++){ var tm=A[c*n+q]; A[c*n+q]=A[piv*n+q]; A[piv*n+q]=tm; }
        var tb=b[c]; b[c]=b[piv]; b[piv]=tb;
      }
      var d = A[c*n+c];
      for(var q2=c;q2<n;q2++) A[c*n+q2] /= d;
      b[c] /= d;
      for(var r2=0;r2<n;r2++){
        if(r2===c) continue;
        var f = A[r2*n+c]; if(f === 0) continue;
        for(var q3=c;q3<n;q3++) A[r2*n+q3] -= f*A[c*n+q3];
        b[r2] -= f*b[c];
      }
    }
    for(var o=0;o<n;o++) Cdecb[o] = b[o];
  }

  function covariances(){
    var Xre = new Float64Array(2*N), Xim = new Float64Array(2*N);
    for(var d=-N+1; d<N; d++){
      var ar=0, ai=0;
      for(var m=-N/2; m<N/2; m++){
        var wr1=Wat(d+m,0), wi1=Wat(d+m,1), wr2=Wat(m,0), wi2=Wat(m,1);
        ar += wr1*wr2 + wi1*wi2; ai += wi1*wr2 - wr1*wi2;
      }
      Xre[d+N]=ar; Xim[d+N]=ai;
    }
    var n2 = sumP*sumP;
    var Ar = new Float64Array(NK*N), Ai = new Float64Array(NK*N);
    var Br = new Float64Array(NK*N), Bi = new Float64Array(NK*N);
    for(var i=0;i<NK;i++){
      var k = KLO + i;
      for(var qi=0; qi<N; qi++){
        var q = qi - N/2, wr = Wat(k-q,0), wi = Wat(k-q,1), c = Cfun(q);
        Ar[i*N+qi] = wr*c; Ai[i*N+qi] = wi*c;
        Br[i*N+qi] = wr;   Bi[i*N+qi] = wi;
      }
    }
    for(var a=0;a<NK;a++){
      var ka = KLO + a, oa = a*N;
      for(var b=0;b<NK;b++){
        var kb = KLO + b, ob = b*N, sr=0, si=0;
        for(var p=0;p<N;p++){
          var x1r=Ar[oa+p], x1i=Ai[oa+p], x2r=Br[ob+p], x2i=Bi[ob+p];
          sr += x1r*x2r + x1i*x2i; si += x1i*x2r - x1r*x2i;
        }
        covE[a*NK+b] = 2*(sr*sr + si*si)/n2;
        //  Cbar = (C_l + C_l')/2, the arithmetic mean the slide-7 entry states.
        //  This used to be C((l+l')/2), the spectrum at the midpoint ARGUMENT,
        //  which differs at second order in l-l' and did not match the equation.
        var cb = 0.5*(Cfun(ka) + Cfun(kb)), dd = ka-kb+N;
        var nr = cb*Xre[dd], ni = cb*Xim[dd];
        covN[a*NK+b] = 2*(nr*nr + ni*ni)/n2;
        //  iNKA, the form the projection slide quotes: the MASK-CONVOLVED
        //  spectrum at the two multipoles, over the mean squared mask. The
        //  <w^2> of the equation is already in Ctil -- it is stored divided by
        //  sumP, and by Parseval sumP = <w^2> -- so dividing again here would
        //  square the mask fraction and blow the matrix up by ~1/f_sky^2, which
        //  is exactly what it did on the first attempt.
        var ci = 0.5*(Ctil[ka] + Ctil[kb]);
        var ir = ci*Xre[dd], ii = ci*Xim[dd];
        covI[a*NK+b] = 2*(ir*ir + ii*ii)/n2;
      }
    }
  }

  // The error the NKA actually makes: it replaces the kernel-weighted average of
  // C by C at the midpoint. (max/min across the kernel is the wrong statistic —
  // at a local extremum C hardly "varies" either side yet the midpoint sits well
  // above the average, which is exactly when the NKA fails.)
  function pullOutError(kc){
    var num = 0, den = 0;
    for(var m=-N/2+1;m<N/2;m++){
      var p = kpow(m), kk = kc - m;
      if(kk < 1) continue;
      num += p*Cfun(kk); den += p;
    }
    return den > 0 ? Cfun(kc)/(num/den) - 1 : 0;
  }
  function pct(x){ return (x>=0?'+':'') + (100*x).toFixed(0) + '%'; }

  // ---------- svg helpers ----------
  var PRINT = /print-pdf/.test(window.location.search);
  var NS = 'http://www.w3.org/2000/svg';
  function el(p,t,a){ var e=document.createElementNS(NS,t);
    for(var k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; }
  function txt(p,x,y,s,a){ var e=el(p,'text',Object.assign({x:x,y:y,'font-size':28,fill:INK},a||{}));
    e.textContent=s; return e; }
  function clear(s){ while(s.firstChild) s.removeChild(s.firstChild); }
  //  base + subscript + rest, so θ_c renders as a symbol rather than an underscore
  function txtsub(p, x, y, base, sub, rest, a){
    var e = el(p,'text',Object.assign({x:x,y:y,'font-size':26,fill:INK}, a||{}));
    e.appendChild(document.createTextNode(base));
    var t = document.createElementNS(NS,'tspan');
    t.setAttribute('dy','6'); t.setAttribute('font-size','0.72em');
    t.textContent = sub; e.appendChild(t);
    var r = document.createElementNS(NS,'tspan');
    r.setAttribute('dy','-6'); r.textContent = rest; e.appendChild(r);
    return e;
  }
  var PAD = 90, W1 = 1730, AW = W1 - PAD - 40;
  //  Panels take an optional plot width so they can sit side by side in columns;
  //  everything defaults to the full-bleed geometry.
  var _x0 = PAD, _w = AW;
  function geom(opts){ _x0 = (opts && opts.x0 != null) ? opts.x0 : PAD;
                       _w  = (opts && opts.w  != null) ? opts.w  : AW; }
  function XK(k, kmax){ return _x0 + _w*(k-1)/((kmax||KMAX)-1); }

  //  The range has to cover the whole curve: the bump peak is NOT the maximum —
  //  C(1) is higher — and clipping the first few modes off the top looks like a
  //  drawing bug.
  function logY(y0,h,kmax){
    var lgmax = Math.log10(Cfun(1)) + 0.06, lgmin = Math.log10(Cfun(kmax)) - 0.06;
    return function(c){ return y0 + h*(1 - (Math.log10(c)-lgmin)/(lgmax-lgmin)); };
  }

  // ---------- panels ----------
  function drawField(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var h = opts.h, y0 = opts.y0 || 30, mid = y0 + h/2;
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    if(opts.mask){
      var d = 'M ' + PAD + ' ' + (y0+h);
      for(var j=0;j<NX;j++) d += ' L ' + (PAD+AW*j/(NX-1)).toFixed(1) + ' ' + (y0+h-mask[j]*h*0.94).toFixed(1);
      d += ' L ' + (PAD+AW) + ' ' + (y0+h) + ' Z';
      el(s,'path',{d:d,fill:COB,opacity:0.13});
      var d2='';
      for(var j2=0;j2<NX;j2++) d2 += (j2?'L':'M')+(PAD+AW*j2/(NX-1)).toFixed(1)+' '+(y0+h-mask[j2]*h*0.94).toFixed(1)+' ';
      el(s,'path',{d:d2,fill:'none',stroke:COB,'stroke-width':3});
      txt(s, PAD+AW-230, y0+28, 'mask  w(x)', {fill:COB});
      txt(s, PAD, y0+28, 'observed  w·a', {fill:INK, 'font-size':27});
    }
    function path(masked, col, wid){
      var d='';
      for(var j=0;j<NX;j++){
        var v = field[j]*(masked ? mask[j] : 1);
        d += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(mid - v*h*0.44).toFixed(1)+' ';
      }
      el(s,'path',{d:d,fill:'none',stroke:col,'stroke-width':wid});
    }
    if(opts.mask){ path(false, FAINT, 2); path(true, INK, 3); }
    else path(false, INK, 3);
    txt(s, Math.max(PAD-82, 2), mid+9, 'a(x)', {fill:MUT});
    txt(s, PAD, y0+h+42, opts.xlabel || 'position  x', {fill:MUT});
  }

  // ── the click-driven mode build ────────────────────────────────────────────
  //   Slide 3 shows the true field once, up top (the .pA panel, shared with
  //   slide 2). This panel is only the mode lanes + the spectrum: five clicks,
  //   each landing one mode's lane and its |a_k|^2 dot together, with a dashed
  //   connector between them while that pair is the most recent. The true
  //   C(k) curve is drawn from the start (slide 3 opens with it already on
  //   screen), so each dot's arrival is the moment it visibly lands ON the
  //   curve — no snap animation needed to make that point. Elements are built
  //   once and only their opacity changes, so the CSS transitions actually run.
  //   Driven by stage = stageOf(root) (data-staged fragments), NOT a timer.
  var NM = MODES.length;
  function buildModes(s){
    clear(s);
    var LANE = 42, CY0 = 30 + NM*LANE, CH = 170;
    var st = {modes:[], labels:[], pts:[], lanes:[], laneY:[], curve:null, clabel:null,
              plus:null, link:null};

    // one shared vertical scale for the lanes, so the spectrum is legible as
    // amplitude: the k = 78 mode really is taller than k = 30, because of the bump
    var big = 0, q, j;
    for(q=0;q<NM;q++)
      for(j=0;j<NX;j+=4) big = Math.max(big, Math.abs(modeAt(MODES[q], j)));
    var lscale = LANE*0.40/Math.max(big,1e-9);

    function pathOf(vals, mid0, sc){
      var d='';
      for(var jj=0;jj<NX;jj++)
        d += (jj?'L':'M')+(PAD+AW*jj/(NX-1)).toFixed(1)+' '+(mid0 - vals[jj]*sc).toFixed(1)+' ';
      return d;
    }

    for(q=0;q<NM;q++){
      var k = MODES[q], y = 30 + q*LANE, lmid = y + LANE*0.45, one = new Float64Array(NX);
      for(j=0;j<NX;j++) one[j] = modeAt(k,j);
      st.lanes.push(el(s,'line',{x1:PAD,y1:lmid,x2:PAD+AW,y2:lmid,stroke:GRID,
                                 'stroke-width':2, opacity:0, class:'cine'}));
      st.modes.push(el(s,'path',{d:pathOf(one, lmid, lscale), fill:'none',
                                 stroke:COB,'stroke-width':3, opacity:0, class:'cine'}));
      st.laneY.push(lmid);
      var t = txt(s, 8, lmid+9, 'ℓ = '+k, {fill:MUT,'font-size':26, opacity:0, class:'cine'});
      st.labels.push(t);
    }
    // shown once every mode has landed: there are more modes than the five drawn
    st.plus = txt(s, PAD+AW-320, 26, '+  every other mode',
                  {fill:MUT,'font-size':27, opacity:0, class:'cine'});

    // the spectrum panel — the true curve is drawn immediately, not staged
    var Y = logY(CY0, CH, KMAX);
    el(s,'line',{x1:PAD,y1:CY0+CH,x2:PAD+AW,y2:CY0+CH,stroke:RULE,'stroke-width':2});
    txtsub(s, 4, CY0+18, 'C', 'ℓ', '', {fill:MUT});
    txt(s, PAD, CY0+CH+42, 'multipole  ℓ', {fill:MUT});
    var dc='';
    for(var kk=1;kk<KMAX;kk++) dc += (kk>1?'L':'M')+XK(kk,KMAX).toFixed(1)+' '+Y(Cin[kk]).toFixed(1)+' ';
    st.curve = el(s,'path',{d:dc,fill:'none',stroke:INK,'stroke-width':3.5,opacity:1});
    // labelled well clear of k=150 (the last mode dot lands right at k=150,
    // and its connector would otherwise cut through the label)
    st.clabel = txt(s, XK(115,KMAX), Y(Cfun(115))-26, 'true  Cℓ', {fill:INK,opacity:1});
    // the connector that links a lane to its point while both are the latest
    st.link = el(s,'line',{x1:0,y1:0,x2:0,y2:0,stroke:COB,'stroke-width':2,
                           'stroke-dasharray':'5 7',opacity:0,class:'cine'});
    for(q=0;q<NM;q++){
      var kq = MODES[q];
      st.pts.push(el(s,'circle',{cx:XK(kq,KMAX),cy:Y(Cfun(kq)),r:10,fill:COB,opacity:0,class:'cine'}));
    }
    s.__modes = st;
    return st;
  }
  //  n = how many mode-pairs have landed (0..NM), driven directly by the
  //  fragment stage — no timer, no autoplay. Clicking back to a lower n
  //  exactly undoes the higher-n state since it's a pure function of n.
  function setModeBeat(s, n){
    var st = s.__modes; if(!st) return;
    var landed = Math.min(n, NM);
    for(var q=0;q<NM;q++){
      var on = (q < landed), lit = (q === landed - 1);
      st.modes[q].style.opacity  = on ? 1 : 0;
      st.modes[q].setAttribute('stroke-width', lit ? 5 : 3);
      st.lanes[q].style.opacity  = on ? 1 : 0;
      st.labels[q].style.opacity = on ? 1 : 0;
      st.labels[q].setAttribute('fill', lit ? COB : MUT);
      st.pts[q].style.opacity    = on ? 1 : 0;
      st.pts[q].setAttribute('r', lit ? 14 : 10);
    }
    st.link.style.opacity = 0;
    if(landed >= 1){
      var i = landed - 1;
      st.link.setAttribute('x1', st.pts[i].getAttribute('cx'));
      st.link.setAttribute('x2', st.pts[i].getAttribute('cx'));
      st.link.setAttribute('y1', st.laneY[i]);
      st.link.setAttribute('y2', st.pts[i].getAttribute('cy'));
      st.link.style.opacity = 1;
    }
    st.plus.style.opacity = (landed >= NM) ? 1 : 0;
  }

  //  ONE legend for the harmonic panels, top-right of the plot box, so the
  //  curve labels do not have to dodge the curves (they used to: "true C(k)"
  //  rode the black line at k=150 and the masked label was parked in the
  //  corner by hand, which read as two unrelated annotations rather than a
  //  key). Rows live in FIXED slots by kind, drawn only when that series is
  //  on: slot 0 masked, 1 true, 2 binned, 3 decoupled. Fixed slots are what
  //  makes it stable — on the staged mask slide the masked curve arrives on a
  //  fragment, and true C(k) must not shuffle down when it does.
  var LEG_SLOT = {masked:0, truth:1, binned:2, decoupled:3};
  function legendRow(s, x, y, kind, col, label){
    var tx = x + 74;
    if(kind === 'binned'){
      el(s,'rect',{x:x+22,y:y-7,width:14,height:14,fill:col});
    } else if(kind === 'decoupled'){
      el(s,'circle',{cx:x+29,cy:y,r:9,fill:col});
    } else {
      var a = {x1:x,y1:y,x2:x+58,y2:y,stroke:col,'stroke-width':3.5,'stroke-linecap':'round'};
      if(kind === 'masked') a['stroke-dasharray'] = '10 7';
      el(s,'line',a);
    }
    // The COMBINING TILDE (U+0303) does not render in the deck's serif: the
    // label came out as "masked C(k)", indistinguishable from the "true C(k)"
    // row directly under it, which defeats the whole point of the legend. So
    // the accent is drawn as its own tspan, shifted back over the letter it
    // belongs to and the shift undone before the rest. (C-with-circumflex is
    // precomposed, U+0108, and needs none of this.)
    var ti = label.indexOf('̃');
    if(ti < 0){ txt(s, tx, y+9, label, {fill:col}); return; }
    var e = el(s,'text',{x:tx,y:y+9,'font-size':28,fill:col});
    e.appendChild(document.createTextNode(label.slice(0, ti)));
    var acc = document.createElementNS(NS,'tspan');
    acc.setAttribute('dx','-17'); acc.setAttribute('dy','-9');
    acc.textContent = '˜'; e.appendChild(acc);
    var rest = document.createElementNS(NS,'tspan');
    rest.setAttribute('dx','8.5'); rest.setAttribute('dy','9');
    rest.textContent = label.slice(ti+1); e.appendChild(rest);
  }
  function drawSpectrum(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var y0 = opts.y0 || 26, h = opts.h, Y = logY(y0,h,KMAX);
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    txtsub(s, Math.max(PAD-86, 2), y0+18, 'C', 'ℓ', '', {fill:MUT});
    if(opts.xlabel !== false) txt(s, PAD, y0+h+42, 'multipole  ℓ', {fill:MUT});

    if(opts.bins) for(var b=0;b<NBIN;b+=2){
      var xa = XK(1+b*NB, KMAX), xb = XK(Math.min(1+(b+1)*NB, KMAX), KMAX);
      el(s,'rect',{x:xa,y:y0,width:xb-xa,height:h,fill:MUT,opacity:0.07});
    }

    var d='';
    for(var k=1;k<KMAX;k++) d += (k>1?'L':'M')+XK(k,KMAX).toFixed(1)+' '+Y(Cin[k]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    var LEGX = PAD + AW - 430, LEGY = y0 + 34, LEGDY = 42;
    function legAt(kind, col, label){
      legendRow(s, LEGX, LEGY + LEGDY*LEG_SLOT[kind], kind, col, label);
    }
    if(opts.label !== false) legAt('truth', INK, 'true  Cℓ');

    //  The masked spectrum is blue, the same blue as the mask and its kernel:
    //  everything the mask did to the measurement reads as one colour.
    if(opts.tilde){
      var d2='';
      for(var k2=1;k2<KMAX;k2++) d2 += (k2>1?'L':'M')+XK(k2,KMAX).toFixed(1)+' '+Y(Ctil[k2]).toFixed(1)+' ';
      el(s,'path',{d:d2,fill:'none',stroke:COB,'stroke-width':3.5,'stroke-dasharray':'10 7'});
      if(opts.label !== false) legAt('masked', COB, 'masked  C̃ℓ');
    }
    if(opts.binned) for(var b2=0;b2<NBIN;b2++){
      var kc = binCentre(b2);
      if(kc < 8 || kc > KMAX-14) continue;
      el(s,'rect',{x:XK(kc,KMAX)-7,y:Y(Ctilb[b2])-7,width:14,height:14,fill:COB});
    }
    if(opts.binned && opts.label !== false) legAt('binned', COB, 'binned  C̃(b)');
    if(opts.decoupled) for(var b3=0;b3<NBIN;b3++){
      var kc3 = binCentre(b3);
      if(kc3 < 8 || kc3 > KMAX-14) continue;
      if(!isFinite(Cdecb[b3]) || Cdecb[b3] <= 0) continue;
      el(s,'circle',{cx:XK(kc3,KMAX),cy:Y(Cdecb[b3]),r:9,fill:TEAL});
    }
    if(opts.decoupled && opts.label !== false) legAt('decoupled', TEAL, 'decoupled  Ĉ(b)');
    if(opts.kernel){
      // just the bump, unannotated — the width/±N mode-counting furniture
      // (the "kernel |W|² at k0" label, the "how many neighbouring modes"
      // caption, and the ±N bar under it) is said in words now, not labelled
      // on every slide that shows the bump.
      var pk = 0, m;
      for(m=-N/2+1;m<N/2;m++) pk = Math.max(pk, kpow(m));
      var dk='';
      for(m=-N/2+1;m<N/2;m++){
        var kk2 = K0 - m; if(kk2 < 0.5 || kk2 > KMAX) continue;
        dk += (dk?'L':'M')+XK(kk2,KMAX).toFixed(1)+' '+(y0+h - (opts.kh||150)*kpow(m)/pk).toFixed(1)+' ';
      }
      var hw = mixRadius(kpow, N/2-1);
      var lo = Math.max(K0-hw,1), hi = Math.min(K0+hw,KMAX-1);
      el(s,'rect',{x:XK(lo,KMAX),y:y0,width:Math.max(XK(hi,KMAX)-XK(lo,KMAX),3),height:h,
                   fill:COB,opacity:0.10});
      el(s,'path',{d:dk,fill:'none',stroke:COB,'stroke-width':3.5});
      if(opts.err === true){
        var v = pullOutError(K0);
        txt(s, PAD+AW-790, y0+26, 'C at ℓ₀ vs its kernel average:  '+pct(v),
            {fill: Math.abs(v)>0.05 ? ACC : COB});
      }
    }
  }

  // ---------- covariance matrices ----------
  function divergent(v){                       // ground -> cobalt / cinnabar
    var t = Math.max(-1, Math.min(1, v));
    if(t >= 0){ var u = Math.pow(t,0.55); return [247-186*u, 240-149*u, 225-65*u]; }
    var u2 = Math.pow(-t,0.55); return [247-59*u2, 240-171*u2, 225-169*u2];
  }
  function heat(cv, mat, scale){
    cv.width = NK; cv.height = NK;
    var ctx = cv.getContext('2d'), im = ctx.createImageData(NK,NK);
    for(var i=0;i<NK;i++) for(var j=0;j<NK;j++){
      var c = divergent(mat[i*NK+j]/scale), o = 4*(i*NK+j);
      im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=255;
    }
    ctx.putImageData(im,0,0);
  }
  //  Shown as correlation matrices, Cov / sqrt(diag diag), so the band stays
  //  visible at every k instead of being swamped by C(k)^2.
  //  N2 -- the projection slide's illustrations. One glance per method, in the
  //  same divergent palette as the covariance slide's matrices.
  //
  //  heatN is heat() for a matrix of any size; heat() itself is hard-wired to
  //  the NK x NK covariance and is left alone.
  function heatN(cv, mat, n, scale){
    cv.width = n; cv.height = n;
    var ctx = cv.getContext('2d'), im = ctx.createImageData(n,n);
    for(var i=0;i<n;i++) for(var j=0;j<n;j++){
      var c = divergent(mat[i*n+j]/scale), o = 4*(i*n+j);
      im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=255;
    }
    ctx.putImageData(im,0,0);
  }

  //  Cov(xi_i, xi_j) in angular bins, got the honest way: a harmonic covariance
  //  sandwiched between two transform kernels, which is Nagura eq. 12 with the
  //  1D analogue of [P_{l+1}-P_{l-1}]. In one dimension
  //  xi(theta) = sum_l 2 C_l cos(2 pi l theta), so the kernel is a cosine over
  //  the same l range the covariance matrices cover. Every configuration-space
  //  panel on the projection slide is this applied to a different harmonic
  //  matrix, so the three methods are compared through one identical pipeline.
  var NTH = 22, THMAX = 0.05, PK = null;
  function projKernel(){
    if(PK) return PK;
    PK = new Float64Array(NTH*NK);
    for(var i=0;i<NTH;i++){
      var th = (i+0.5)/NTH*THMAX;
      for(var ki=0; ki<NK; ki++) PK[i*NK+ki] = 2*Math.cos(2*Math.PI*(KLO+ki)*th);
    }
    return PK;
  }
  function project(cov){
    var T = projKernel(), M = new Float64Array(NTH*NK), out = new Float64Array(NTH*NTH),
        i, j, aa, bb;
    for(i=0;i<NTH;i++) for(bb=0;bb<NK;bb++){
      var acc = 0;
      for(aa=0;aa<NK;aa++) acc += T[i*NK+aa]*cov[aa*NK+bb];
      M[i*NK+bb] = acc;
    }
    for(i=0;i<NTH;i++) for(j=0;j<NTH;j++){
      var v = 0;
      for(bb=0;bb<NK;bb++) v += M[i*NK+bb]*T[j*NK+bb];
      out[i*NTH+j] = v;
    }
    return out;
  }
  //  correlation matrices, always normalised by the EXACT diagonal, so the
  //  three methods sit on one scale and a difference means something
  function normBy(m, d, n){
    var o = new Float64Array(n*n);
    for(var i=0;i<n;i++) for(var j=0;j<n;j++) o[i*n+j] = m[i*n+j]/(d[i]*d[j]);
    return o;
  }
  function diagOf(m, n){
    var d = new Float64Array(n);
    for(var i=0;i<n;i++) d[i] = Math.sqrt(Math.abs(m[i*n+i])) || 1;
    return d;
  }
  //  the difference panels answer "where is the error", so the diagonal -- which
  //  every method gets nearly right, and which would dominate the colour scale
  //  -- is zeroed. That is the paper's whole point about off-diagonals.
  function diffNoDiag(a2, b2, n){
    var o = new Float64Array(n*n);
    for(var i=0;i<n;i++) for(var j=0;j<n;j++) o[i*n+j] = (i===j) ? 0 : a2[i*n+j]-b2[i*n+j];
    return o;
  }

  var PROJ = null;
  function projSet(){
    if(PROJ) return PROJ;
    var i, j;
    var dH = diagOf(covE, NK);
    var Fh = new Float64Array(NK*NK);            // f_sky: the diagonal, nothing else
    for(i=0;i<NK;i++) Fh[i*NK+i] = covE[i*NK+i];
    var pE = project(covE), pF = project(Fh), pI = project(covI);
    var dC = diagOf(pE, NTH);
    var nE = normBy(pE, dC, NTH), nF = normBy(pF, dC, NTH), nI = normBy(pI, dC, NTH);
    PROJ = {
      hE: normBy(covE, dH, NK), hF: normBy(Fh, dH, NK), hI: normBy(covI, dH, NK),
      cE: nE, cF: nF, cI: nI,
      dF: diffNoDiag(nF, nE, NTH), dI: diffNoDiag(nI, nE, NTH),
      dQ: new Float64Array(NTH*NTH)              // quartic counts ARE the exact answer
    };
    return PROJ;
  }

  function drawProj(root){
    var P = projSet(), q = function(c){ return root.querySelector('canvas.'+c); };
    function put(c, m, n, sc){ var cv = q(c); if(cv) heatN(cv, m, n, sc); }
    put('hFsky', P.hF, NK, 1);   put('cFsky', P.cF, NTH, 1);   put('dFsky', P.dF, NTH, 0.5);
    put('hInka', P.hI, NK, 1);   put('cInka', P.cI, NTH, 1);   put('dInka', P.dI, NTH, 0.5);
                                 put('cQuar', P.cE, NTH, 1);   put('dQuar', P.dQ, NTH, 0.5);
  }

  function drawMatrices(root){
    var cvs = root.querySelectorAll('canvas');
    if(cvs.length < 3) return;
    var rE=new Float64Array(NK*NK), rN=new Float64Array(NK*NK), rD=new Float64Array(NK*NK),
        d=new Float64Array(NK);
    for(var i=0;i<NK;i++) d[i] = Math.sqrt(covE[i*NK+i]);
    for(var a=0;a<NK;a++) for(var b=0;b<NK;b++){
      var q=a*NK+b, nrm=d[a]*d[b];
      rE[q]=covE[q]/nrm; rN[q]=covN[q]/nrm; rD[q]=rN[q]-rE[q];
    }
    heat(cvs[0], rE, 1); heat(cvs[1], rN, 1); heat(cvs[2], rD, 0.35);
  }

  // ═══ catalogue masks (the Wolz act) ═══════════════════════════════════════
  //  A catalogue's mask IS its sources: w(x) = sum_i w_i delta(x - x_i). There is
  //  no separate footprint map, which is exactly what breaks the machinery above.
  //  140. Two pulls in opposite directions: the coherent rise the mask spectrum
  //  can show is capped at N, which wants MORE sources; but the k axis has to
  //  run past pi/theta_c = N/2, so the footprint-scale rise (fixed at k of a
  //  few tens) occupies a share of the axis that goes like 1/N, which wants
  //  FEWER. At 300 the rise was a spike against the left edge. 140 keeps well
  //  over a decade of rise and gives it a quarter of the axis.
  var NSRC = 140, THC = 0.0;          // sources, and the cloud size in units of L
  var CATSEED = 90210;

  //  Plain uniform iid, sorted. An earlier pass added minimum-separation
  //  rejection sampling here to stop two sources landing in the same NX cell
  //  (a double-height spike at minimum cloud width on the products slide) —
  //  reverted on Cail's call: the coarser, occasionally-colliding look is
  //  what that slide wants, collisions and all.
  //  NOT mulberry here. 300 consecutive mulberry draws come out measurably
  //  sub-Poisson: the mask's measured |w_k|^2 plateau sat about 18% below
  //  sum w_i^2, so the curve floated under its own dashed Nw line and the one
  //  quantitative claim the panel makes looked wrong. xorshift128 (seeded from
  //  mulberry, so the deck stays deterministic) lands on the floor.
  function xs128(seed){
    var m = mulberry(seed);
    var a = (m()*4294967296)|0 || 123456789, b = (m()*4294967296)|0 || 362436069,
        c = (m()*4294967296)|0 || 521288629, d = (m()*4294967296)|0 || 88675123;
    return function(){
      var t = a ^ (a << 11); a = b; b = c; c = d;
      d = (d ^ (d >>> 19)) ^ (t ^ (t >>> 8));
      return (d >>> 0) / 4294967296;
    };
  }
  function catPositions(n, seed){
    var rng = xs128(seed || CATSEED), xs = [];
    for(var i=0;i<n;i++) xs.push(rng());
    xs.sort(function(a,b){ return a-b; });
    return xs;
  }
  //  On the grid: unit mean, so the delta comb is comparable with a continuous
  //  mask. A cloud of size thc simply band-limits it.
  function catGrid(xs, thc){
    var w = new Float64Array(NX), amp = NX/xs.length;
    if(thc <= 0){
      for(var i=0;i<xs.length;i++) w[Math.min(NX-1, Math.floor(xs[i]*NX))] += amp;
    } else {
      var sg = thc*NX, half = Math.ceil(4*sg), norm = amp/(Math.sqrt(2*Math.PI)*sg);
      for(var i2=0;i2<xs.length;i2++){
        var c = xs[i2]*NX;
        for(var d=-half; d<=half; d++){
          var j = Math.round(c+d); j = ((j % NX) + NX) % NX;
          w[j] += norm*Math.exp(-0.5*d*d/(sg*sg));
        }
      }
    }
    return w;
  }
  var CAT = {xs:null, n:0, thc:-1, W:null};
  function catBuild(){
    if(CAT.n !== NSRC) CAT.xs = catPositions(NSRC);
    if(CAT.n !== NSRC || CAT.thc !== THC){
      CAT.n = NSRC; CAT.thc = THC;
      CAT.W = transform(catGrid(CAT.xs, THC));
    }
    return CAT;
  }
  function catKpow(m){
    var i = (m + N) % N;
    return CAT.W.re[i]*CAT.W.re[i] + CAT.W.im[i]*CAT.W.im[i];
  }

  //  SLIDE 8 has its own, much sparser catalogue, and it is guarded.
  //  Two reasons it cannot just reuse CAT. First legibility: at the deck's 160
  //  sources the Gaussian clouds overlap into a single band the moment the
  //  slider leaves zero, and the whole point of that slide is watching
  //  individual deltas bloom and only THEN merge. Second correctness: with
  //  clouds this broad, two sources sharing one NX cell produce a double-height
  //  spike that reads as a drawing bug rather than as physics. So here, and
  //  only here, positions are rejected until every gap clears MINGAP. That is
  //  the opposite call from W1's comb, where collisions are honest Poisson
  //  behaviour and are left alone.
  var NS8 = 42, MINGAP8 = 0.45;      // sources, and the guard in units of 1/NS8
  var CAT8 = {};
  function cat8(seed){
    if(CAT8[seed]) return CAT8[seed];
    var rng = mulberry(seed), xs = [], need = MINGAP8/NS8, guard = 0;
    while(xs.length < NS8 && guard++ < 200000){
      var x = rng(), ok = true;
      for(var i=0;i<xs.length;i++)
        if(Math.abs(xs[i]-x) < need || Math.abs(xs[i]-x) > 1-need){ ok = false; break; }
      if(ok) xs.push(x);
    }
    xs.sort(function(a,b){ return a-b; });
    CAT8[seed] = xs;
    return xs;
  }

  //  W1 fragment 2 — a real survey footprint dropped onto the catalogue.
  //  A smooth window with three gaps, in catalogue coordinates x in [0,1).
  //  Sources survive with probability footAt(x): a catalogue has no separate
  //  window map, so the footprint can only show up as which objects exist.
  //  A CONTIGUOUS region with two gaps, not a row of equal blocks. The shape
  //  matters: what lifts |w_k|^2 off the floor is the window's own transform,
  //  and evenly-spaced blocks put all of that at one k (the block period)
  //  instead of across low k. One survey region behaves like a top hat — power
  //  at the lowest k, falling back to the floor by k ~ 10 — which is the shape
  //  Wolz Fig. 1 shows. The ceiling on the rise is N times the coverage, so at
  //  the deck's 160 sources it is about a decade and a half; Quaia has millions
  //  of sources and gets six.
  //  One contiguous survey region with TWO gaps of different size. The single
  //  gap put nearly all the coherent power in the first few modes; a second,
  //  narrower gap adds structure at its own inverse scale and carries the rise
  //  out to k of about twenty-five without making it ratty.
  var HOLES = [[0.408,0.055],[0.610,0.024]];
  function footAt(x){
    var v = ramp((0.27 - Math.abs(x-0.5))/0.028 + 0.5);
    for(var i=0;i<HOLES.length;i++)
      v *= 1 - ramp((HOLES[i][1] - Math.abs(x-HOLES[i][0]))/0.024 + 0.5);
    return v;
  }
  //  Deterministic per-source draw, so the surviving set never flickers between
  //  redraws (reveal re-renders the slide on every fragment change).
  var FOOTU = null;
  function footKeep(xs){
    if(!FOOTU || FOOTU.length < xs.length){
      var r = xs128(31337); FOOTU = [];
      for(var i=0;i<xs.length+64;i++) FOOTU.push(r());
    }
    var out = [];
    for(var j=0;j<xs.length;j++) if(FOOTU[j] < footAt(xs[j])) out.push(xs[j]);
    return out;
  }

  //  |w_k|^2 of the catalogue mask itself, summed honestly over the drawn
  //  positions: w_k = sum_i e^{-ikx_i} with k = 2*pi*m. 160 sources x 200 modes
  //  is nothing, so there is no need for the gridded transform used elsewhere.
  //  Band-averaged over +-3 modes: a single realisation of |w_k|^2 is
  //  exponentially distributed and the raw curve is unreadable scatter; the
  //  paper's own red curve is an m-average at each multipole for the same reason.
  //  The plotted range follows the catalogue. pi/theta_c sits at mode N/2, and
  //  the axis stops just past it, so that marker lands near the right edge and
  //  the footprint-scale rise -- which lives at a k of order ten whatever N is
  //  -- keeps a fifth of the width instead of being a spike on the left edge.
  //  Nothing is hidden by stopping there: past pi/theta_c the curve is flat
  //  shot noise, which the visible four fifths of the axis already establishes.
  var MPS = 200, MPSW = 12;
  function setMPS(n){
    var m = Math.max(60, Math.round(0.55*n));
    if(m !== MPS){ MPS = m; MPSC = {}; }
  }
  function catMaskPS(xs){
    var raw = new Float64Array(MPS+1+MPSW), out = new Float64Array(MPS+1);
    for(var m=1;m<=MPS+MPSW;m++){
      var sr=0, si=0;
      for(var i=0;i<xs.length;i++){ var ph=2*Math.PI*m*xs[i]; sr+=Math.cos(ph); si-=Math.sin(ph); }
      raw[m]=sr*sr+si*si;
    }
    //  a window PROPORTIONAL to k -- band-powers, in effect -- never narrower
    //  than one neighbour either side, because a single-mode null at k = 1
    //  drops the curve to the floor of the box and reads as a drawing bug. A single
    //  realisation of |w_k|^2 is exponentially distributed, so a fixed narrow
    //  average leaves chance excursions of two or three times the floor that
    //  read as features; averaging over ~25% of k flattens the floor to a few
    //  percent while leaving the lowest modes, where the coherent rise lives,
    //  essentially unsmoothed.
    for(var q=1;q<=MPS;q++){
      var wq = Math.max(1, Math.min(MPSW, Math.floor(q*0.30))), a=0, n=0;
      for(var d=-wq; d<=wq; d++){ var mm=q+d; if(mm>=1 && mm<=MPS+MPSW){ a+=raw[mm]; n++; } }
      out[q]=a/n;
    }
    return out;
  }
  //  The SMOOTH footprint's own |W_k|^2 -- what a pixelised map of the same
  //  window would measure, with no shot noise in it at all. Normalised to the
  //  same total weight as the catalogue (W(x) = N foot(x) / mean(foot)), so the
  //  two curves are directly comparable: the catalogue's spectrum IS this plus
  //  a flat Nw. Band-averaged with the same window as the catalogue's, or the
  //  comparison would be between a smooth curve and a ratty one.
  var FPSC = null;
  function footPS(n){
    if(FPSC && FPSC.n === n && FPSC.mps === MPS) return FPSC.p;
    var raw = new Float64Array(MPS+MPSW+1), j, m, f0 = 0;
    for(j=0;j<NX;j++) f0 += footAt(j/NX);
    f0 /= NX;
    for(m=1;m<=MPS+MPSW;m++){
      var sr=0, si=0;
      for(j=0;j<NX;j++){
        var ph = 2*Math.PI*m*j/NX, fv = footAt(j/NX);
        sr += fv*Math.cos(ph); si -= fv*Math.sin(ph);
      }
      sr = n*sr/(NX*f0); si = n*si/(NX*f0);
      raw[m] = sr*sr + si*si;
    }
    var out = new Float64Array(MPS+1);
    for(var q=1;q<=MPS;q++){
      var wq = Math.max(1, Math.min(MPSW, Math.floor(q*0.30))), a=0, nn=0;
      for(var d=-wq; d<=wq; d++){ var mm=q+d; if(mm>=1 && mm<=MPS+MPSW){ a+=raw[mm]; nn++; } }
      out[q] = a/nn;
    }
    FPSC = {n:n, mps:MPS, p:out};
    return out;
  }

  var MPSC = {};
  function maskPSof(key, xs){
    key = key + '@' + MPS;
    if(!MPSC[key]) MPSC[key] = catMaskPS(xs);
    return MPSC[key];
  }

  //  W1 — the mask's OWN power spectrum, the toy version of Wolz Fig. 1.
  //  Fragment 0: uniform positions, so the deltas add incoherently at every k
  //  and |w_k|^2 is a flat floor at sum w_i^2 = N.
  //  Fragment 1: a footprint. Below the inverse footprint scale the deltas add
  //  COHERENTLY -- they trace the window -- and the spectrum lifts off the floor
  //  by up to a factor N before falling back onto it.
  //  Axes are anchored to the FULL catalogue's floor in both fragments on
  //  purpose: the rise has to be read against a ruler that does not move.
  //  With opts.cloud the panel also carries the band-limit: every delta becomes
  //  a Gaussian of width theta_c, which multiplies the spectrum by |G_k|^2 =
  //  exp(-(2 pi m theta_c)^2). The coherent low-k part is untouched; the white
  //  floor rolls off above k ~ pi/theta_c. That, and nothing else, is the fix.
  function drawMaskPS(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 34, h = opts.h || 200;
    catBuild(); setMPS(CAT.xs.length);
    var holed = !!opts.foot, cloud = !!opts.cloud;
    var xs = holed ? footKeep(CAT.xs) : CAT.xs;
    var ps = maskPSof((holed?'h':'u') + xs.length, xs);
    var floor = xs.length;                       // sum w_i^2 with unit weights
    var fref = CAT.xs.length;                    // the axis anchor, always
    //  The cloud panel needs room underneath for the roll-off; the bare panel
    //  would waste two thirds of its box on it.
    var lg0 = Math.log10(fref) - (cloud ? 3.2 : 0.9), lg1 = Math.log10(fref) + 1.5;
    function Y(v){ return y0 + h*(1 - Math.min(1, Math.max(0,
                     (Math.log10(Math.max(v,1e-12)) - lg0)/(lg1-lg0)))); }
    function X(m){ return PAD + AW*(m-1)/(MPS-1); }
    function G2(m){ return cloud && THC > 0
                    ? Math.exp(-Math.pow(2*Math.PI*m*THC, 2)) : 1; }

    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    el(s,'line',{x1:PAD,y1:y0,x2:PAD,y2:y0+h,stroke:RULE,'stroke-width':2});

    //  pi/theta_c. With a cloud that is the band-limit itself and it MOVES with
    //  the slider; with bare deltas theta_c is the mean source spacing 1/N, so
    //  the line sits at mode N/2 and the floor is reached far to the left of it
    //  -- the paper's point, and the toy reproduces it.
    var mc = (cloud && THC > 0) ? 1/(2*THC) : fref/2;
    if(mc > 2 && mc < MPS){
      el(s,'line',{x1:X(mc),y1:y0,x2:X(mc),y2:y0+h,stroke:INK,'stroke-width':2.5,
                   'stroke-dasharray':'11 8'});
      //  the marker sits near the right edge once the axis is cut just past it,
      //  so the label flips to the inside rather than running off the panel
      var lx = X(mc), rgt = lx > PAD + 0.72*AW;
      txtsub(s, rgt ? lx-14 : lx+12, y0+24, 'π/θ', 'c', '',
             {fill:INK,'font-size':26,'text-anchor': rgt ? 'end' : 'start'});
    }

    //  the shot-noise floor, named on the line so it is visibly not zero
    var yf = Y(floor*G2(0));
    el(s,'line',{x1:PAD,y1:Y(floor),x2:PAD+AW,y2:Y(floor),stroke:MUT,'stroke-width':2.5,
                 'stroke-dasharray':'7 7'});


    //  the smooth footprint's own spectrum: no shot noise, so it is the thing
    //  the band-limited catalogue mask is trying to become. Dragging theta_c
    //  until the red lies on the blue is the whole slide.
    if(opts.pixel){
      var fp = footPS(xs.length), dp = '', op = false;
      for(var mp=1;mp<=MPS;mp++){
        if(Math.log10(Math.max(fp[mp],1e-12)) < lg0){ op = false; continue; }
        dp += (op?'L':'M')+X(mp).toFixed(1)+' '+Y(fp[mp]).toFixed(1)+' '; op = true;
      }
      el(s,'path',{d:dp,fill:'none',stroke:COB,'stroke-width':3,opacity:0.85});
      txt(s, PAD+AW-330, y0+h-16, 'the footprint alone', {fill:COB,'font-size':26});
    }

    //  everything the curve carries ABOVE the floor, shaded: that band is the
    //  coherent part, and it is what the paper's red curve shows.
    var yfl = Y(floor), dfill = 'M '+PAD+' '+yfl.toFixed(1);
    for(var mf=1;mf<=MPS;mf++)
      dfill += ' L '+X(mf).toFixed(1)+' '+Math.min(yfl, Y(ps[mf]*G2(mf))).toFixed(1);
    dfill += ' L '+(PAD+AW).toFixed(1)+' '+yfl.toFixed(1)+' Z';
    el(s,'path',{d:dfill,fill: holed?ACC:COB,opacity:0.16});

    //  the curve LEAVES the box when the cloud has suppressed it past the
    //  bottom of the axis; clamping it would draw a floor that is not there.
    var d='', open2=false;
    for(var m2=1;m2<=MPS;m2++){
      var v2 = ps[m2]*G2(m2);
      if(Math.log10(Math.max(v2,1e-12)) < lg0){ open2 = false; continue; }
      d += (open2?'L':'M')+X(m2).toFixed(1)+' '+Y(v2).toFixed(1)+' '; open2 = true;
    }
    el(s,'path',{d:d,fill:'none',stroke: holed?ACC:COB,'stroke-width':2.8});

    txtsub(s, Math.max(PAD-72,2), y0+20, '|W', 'ℓ', '|²', {fill:MUT,'font-size':27});
    txt(s, PAD, y0+h+40, 'multipole  ℓ', {fill:MUT,'font-size':26});
  }

  //  W1 — the sources are the mask
  function drawCatalogue(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 34, h = opts.h || 250, mid = y0 + h/2;
    catBuild();
    //  Fragment 1 drops a survey footprint on the catalogue. There is no
    //  separate window to draw over the field: the footprint IS which sources
    //  exist, so it shows up as sources going missing from both rows at once.
    var SRC = opts.foot ? footKeep(CAT.xs) : CAT.xs;
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    var d='';
    for(var j=0;j<NX;j++) d += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(mid-field[j]*h*0.42).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:FAINT,'stroke-width':2});
    txt(s, Math.max(PAD-82,2), mid+9, 'a(x)', {fill:MUT});
    //  No source count. The only clear space on this panel is inside the a(x)
    //  trace or under the footprint label, and text over data is worse than the
    //  number being spoken instead; it is in the notes.
    //  Every source in the catalogue is drawn, coloured by how much of it the
    //  survey actually sees: grey outside the footprint, the footprint's own
    //  blue inside, and graded across the apodised edges. Nothing appears or
    //  disappears -- the mask is a weight on a catalogue that was always there.
    //  Always the footprint's blue, never the band-limited slide's red: the
    //  a(x) row is identical on both catalogue slides, and only the comb below
    //  it changes colour when the mask becomes w-bar.
    var DOT = COB;
    for(var i=0;i<CAT.xs.length;i++){
      var xg = Math.min(NX-1, Math.floor(CAT.xs[i]*NX)), v = field[xg];
      var X = PAD + AW*CAT.xs[i], Y = mid - v*h*0.42;
      var wv = opts.foot ? footAt(CAT.xs[i]) : 1;
      el(s,'circle',{cx:X,cy:Y,r:3.2+5*Math.abs(v),
                     fill: opts.foot ? mixHex('#C5B89E', DOT, wv) : INK,
                     opacity:0.9});
    }
    // the same sources, as the mask: a comb of deltas
    var by = y0 + h + 62;
    if(opts.foot){
      //  the footprint itself, as a smooth band behind the comb — the shape the
      //  surviving deltas are tracing, and the reason they add coherently
      var df = 'M ' + PAD + ' ' + by, NF = 400;
      for(var jf=0; jf<=NF; jf++)
        df += ' L ' + (PAD+AW*jf/NF).toFixed(1) + ' ' + (by - 64*footAt(jf/NF)).toFixed(1);
      df += ' L ' + (PAD+AW) + ' ' + by + ' Z';
      el(s,'path',{d:df,fill:COB,opacity:0.12});
      var df2='';
      for(var jg=0; jg<=NF; jg++)
        df2 += (jg?'L':'M')+(PAD+AW*jg/NF).toFixed(1)+' '+(by - 64*footAt(jg/NF)).toFixed(1)+' ';
      el(s,'path',{d:df2,fill:'none',stroke:COB,'stroke-width':2.5,opacity:0.55});
      //  under the comb's axis, not between the rows: with the panel tightened
      //  the old position sat on top of the a(x) trace
      txt(s, PAD+AW-320, by+24, 'survey footprint', {fill:COB,'font-size':26,opacity:0.85});
    }
    el(s,'line',{x1:PAD,y1:by,x2:PAD+AW,y2:by,stroke:RULE,'stroke-width':2});
    if(opts.cloud && THC > 0){
      //  the band-limited mask: every delta is a Gaussian of width theta_c and
      //  they add, so overlapping clouds merge into a continuous window --
      //  which is exactly what the band-limit is for.
      var wg = catGrid(SRC, THC), mxg = 0, jg;
      for(jg=0;jg<NX;jg++) if(wg[jg] > mxg) mxg = wg[jg];
      var dc = 'M ' + PAD + ' ' + by;
      for(jg=0;jg<NX;jg++)
        dc += ' L ' + (PAD+AW*jg/(NX-1)).toFixed(1) + ' ' + (by - 62*wg[jg]/mxg).toFixed(1);
      dc += ' L ' + (PAD+AW) + ' ' + by + ' Z';
      el(s,'path',{d:dc,fill:ACC,opacity:0.16});
      var dc2='';
      for(jg=0;jg<NX;jg++)
        dc2 += (jg?'L':'M')+(PAD+AW*jg/(NX-1)).toFixed(1)+' '+(by - 62*wg[jg]/mxg).toFixed(1)+' ';
      el(s,'path',{d:dc2,fill:'none',stroke:ACC,'stroke-width':2.5});
    } else for(var i2=0;i2<SRC.length;i2++){
      var X2 = PAD + AW*SRC[i2];
      var cc = opts.cloud ? ACC : COB;
      el(s,'line',{x1:X2,y1:by,x2:X2,y2:by-62,stroke:cc,'stroke-width':2});
      el(s,'circle',{cx:X2,cy:by-62,r:3,fill:cc});
    }
    txt(s, Math.max(PAD-88,2), by+9, opts.cloud ? 'w̄(x)' : 'w(x)',
        {fill: opts.cloud ? ACC : COB});



    //  The cloud scale: theta_c drawn as the MEAN interparticle spacing, 1/N,
    //  and the bar parked on the real gap closest to that length so it spans
    //  two actual neighbouring sources rather than floating over a clump.
    //  It used to be whichever gap was largest within twelve sources of the
    //  middle, which read several times too wide and jumped as the slider
    //  moved. Note the paper's own theta_ip is a MEDIAN interparticle distance
    //  (main.tex 458), which for a Poisson sample is about a third of this —
    //  three pixels here, too small to see. This bar is the legible proxy the
    //  label promises ("source spacing"), not theta_ip to the letter.
    var tc = 1/SRC.length, best = 1, bd = Infinity;
    for(var q=1; q<SRC.length; q++){
      var dq = Math.abs((SRC[q]-SRC[q-1]) - tc);
      if(dq < bd){ bd = dq; best = q; }
    }
    var cmid = 0.5*(SRC[best-1] + SRC[best]);
    var xL = PAD + AW*(cmid - tc/2), xR = PAD + AW*(cmid + tc/2), yb2 = by + 28;
    el(s,'line',{x1:xL,y1:yb2,x2:xR,y2:yb2,stroke:TEAL,'stroke-width':4,'stroke-linecap':'round'});
    el(s,'line',{x1:xL,y1:yb2-9,x2:xL,y2:yb2+9,stroke:TEAL,'stroke-width':3});
    el(s,'line',{x1:xR,y1:yb2-9,x2:xR,y2:yb2+9,stroke:TEAL,'stroke-width':3});
    txtsub(s, xR+16, yb2+9, 'θ', 'c', '  ≈  source spacing', {fill:TEAL,'font-size':26});
    //  the label's descenders have to clear the viewBox, not just its baseline
    txt(s, PAD, by+52, 'position  x', {fill:MUT});
  }

  //  W1 — THE COUPLING KERNEL of the catalogue mask: |W_m|^2 against mode
  //  separation Delta-k, log-log. This is the object the whole first act was
  //  about, which is why it is drawn here rather than the mask's power
  //  spectrum: the same numbers, but the kernel is what the convolution
  //  actually uses, and it is the thing that is supposed to be narrow.
  //  It isn't. A comb of deltas has no scale below the mean source spacing, so
  //  the kernel is flat and ratty at every separation, sitting on the mask's
  //  own shot-noise floor Nw = sum w_i^2 / 4pi. Nothing to be narrow around —
  //  the narrow-kernel approximation never starts.
  //  Deliberately near-wordless: no title, no axis caption, no annotation of
  //  the curve. Curve, dashed floor, and the floor's name. The one sentence
  //  under the panel carries the rest.
  function drawCatKernel(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 40, h = opts.h || 150, MM = 120;
    catBuild();
    var pk = 0, p = [], m, floor = 0, nf = 0;
    for(m=1;m<=MM;m++){ var v = catKpow(m); p.push(v); if(v>pk) pk=v;
                        if(m > 6){ floor += v; nf++; } }
    floor = nf ? floor/nf : 0;
    // TWO decades below the peak, not six. The kernel is flat to within about
    // a decade, so a six-decade axis pinned the whole curve into the top sixth
    // of the panel with a large empty band beneath it that read as a drawing
    // error. Two decades fills the box and lets the rattiness show, which is
    // the actual content. Deep nulls clip onto the floor of the box.
    var lo2 = pk/100;
    function Y(v){ return y0 + h*(1 - Math.min(1, Math.max(0,
                     Math.log10(Math.max(v,1e-30)/lo2)/2))); }
    function X(m){ return PAD + AW*Math.log10(m)/Math.log10(MM); }
    var d='';
    for(var q=0;q<p.length;q++)
      d += (q?'L':'M')+X(q+1).toFixed(1)+' '+Y(p[q]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:ACC,'stroke-width':2.5,opacity:0.8});
    el(s,'line',{x1:PAD,y1:Y(floor),x2:PAD+AW,y2:Y(floor),stroke:INK,
                 'stroke-width':3,'stroke-dasharray':'12 8'});
    txtsub(s, PAD, Y(floor)+40, 'N', 'w', '', {fill:INK,'font-size':26});
  }

  //  N1 -- the correlation function as a PAIR COUNT, on the same drawn
  //  catalogue as the mask slides. The Nagura act opens with a covariance
  //  double sum that lands cold; this builds the object first.
  //
  //  Bins are linear in separation over [0, XIMAX]. XIMAX = 0.15 of the box
  //  covers both features of the toy field: the broad decay set by the
  //  spectrum's turnover near k = 18, and the oscillation at 1/78 from the
  //  bump. The estimator is the ordinary one, unit weights,
  //      xi(theta) = sum_{pairs in bin} a_i a_j / N_pair,
  //  summed over the actual drawn positions -- noisy, and true. Because a_i is
  //  the field sampled exactly at x_i, it is unbiased for the FIELD's own
  //  autocorrelation, which is what the thin reference line is: not the
  //  ensemble C(k) transform, but this realisation's, so the scatter you see is
  //  honest sampling scatter and nothing else.
  //  0.04 of the box, not 0.15. The toy field's spectrum turns over near mode
  //  18 and the phase is 2 pi k x, so its correlation length is 1/(2 pi 18),
  //  about 0.009 -- a xi plotted out to 0.15 is a spike against the axis
  //  followed by nothing. At 0.04 the decay takes a quarter of the panel and
  //  the bump's ringing (period 1/78) is a few bins wide.
  var XIMAX = 0.04, XINB = 20;
  //  the three separations the fragments stop at, in bins
  var XISTOP = [4, 9, 16];
  function xibin(th){ return Math.floor(th/XIMAX*XINB); }
  var XIC = null;
  function xiBuild(){
    if(XIC && XIC.n === CAT.xs.length) return XIC;
    var xs = CAT.xs, n = xs.length;
    var sum = new Float64Array(XINB), cnt = new Float64Array(XINB), i, j, b;
    var av = new Float64Array(n);
    for(i=0;i<n;i++) av[i] = field[Math.min(NX-1, Math.floor(xs[i]*NX))];
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var d = xs[j]-xs[i]; if(d > 0.5) d = 1-d;       // periodic box
      if(d >= XIMAX) continue;
      var b = xibin(d); sum[b] += av[i]*av[j]; cnt[b] += 1;
    }
    var xi = new Float64Array(XINB);
    for(b=0;b<XINB;b++) xi[b] = cnt[b] ? sum[b]/cnt[b] : 0;
    //  the field's own autocorrelation, on the same bin centres
    var tru = new Float64Array(XINB);
    for(b=0;b<XINB;b++){
      var lag = Math.round((b+0.5)/XINB*XIMAX*NX), a2 = 0;
      for(var q=0;q<NX;q++) a2 += field[q]*field[(q+lag)%NX];
      tru[b] = a2/NX;
    }
    XIC = {n:n, xi:xi, cnt:cnt, tru:tru, av:av};
    return XIC;
  }
  function xiTheta(b){ return (b+0.5)/XINB*XIMAX; }

  //  N1 top panel: the catalogue, with every pair at one separation drawn.
  //  The web of thin lines is the point -- a pair count at one theta is
  //  hundreds of pairs, not the one the bracket labels.
  function drawPairs(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 30, h = opts.h || 150, mid = y0 + h/2;
    catBuild(); var X = xiBuild(), xs = CAT.xs;
    var st = opts.stage == null ? 0 : opts.stage;
    el(s,'line',{x1:PAD,y1:mid,x2:PAD+AW,y2:mid,stroke:RULE,'stroke-width':2});
    var d='';
    for(var j=0;j<NX;j++) d += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(mid-field[j]*h*0.42).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:FAINT,'stroke-width':2});
    txt(s, Math.max(PAD-82,2), mid+9, 'a(x)', {fill:MUT});

    //  the pairs at the fragment's separation, drawn as arcs beneath the axis
    var bsel = (st >= 1 && st <= XISTOP.length) ? XISTOP[st-1] : -1;
    if(bsel >= 0){
      var lo = bsel/XINB*XIMAX, hi = (bsel+1)/XINB*XIMAX, arcs = 0, best = -1, bj = -1;
      var yb = y0 + h + 16;
      for(var i=0;i<xs.length;i++) for(var k=i+1;k<xs.length;k++){
        var dd = xs[k]-xs[i]; if(dd >= hi) break;
        if(dd < lo) continue;
        var xa = PAD+AW*xs[i], xb2 = PAD+AW*xs[k], r = (xb2-xa)/2;
        //  sweep 0, not 1: the arc bows DOWN and its two ends point up at the
        //  pair of sources it joins, instead of arching over them
        el(s,'path',{d:'M'+xa.toFixed(1)+' '+yb+' A '+r.toFixed(1)+' '+Math.min(r,34).toFixed(1)+
                        ' 0 0 0 '+xb2.toFixed(1)+' '+yb, fill:'none',stroke:COB,
                     'stroke-width':1.6,opacity:0.32});
        arcs++;
        //  one pair, near the middle, gets the label
        if(best < 0 && xs[i] > 0.44){ best = i; bj = k; }
      }
      if(best >= 0){
        var xa2 = PAD+AW*xs[best], xb3 = PAD+AW*xs[bj];
        el(s,'circle',{cx:xa2,cy:mid-X.av[best]*h*0.42,r:9,fill:'none',stroke:ACC,'stroke-width':3.5});
        el(s,'circle',{cx:xb3,cy:mid-X.av[bj]*h*0.42,r:9,fill:'none',stroke:ACC,'stroke-width':3.5});
        var yt = y0 + h + 74;
        el(s,'line',{x1:xa2,y1:yt,x2:xb3,y2:yt,stroke:ACC,'stroke-width':3.5});
        el(s,'line',{x1:xa2,y1:yt-10,x2:xa2,y2:yt+10,stroke:ACC,'stroke-width':3});
        el(s,'line',{x1:xb3,y1:yt-10,x2:xb3,y2:yt+10,stroke:ACC,'stroke-width':3});
        txt(s, xb3+18, yt+9, 'θ', {fill:ACC,'font-size':30,'font-style':'italic'});
          txt(s, PAD+AW-360, y0+16, arcs + ' pairs at this θ', {fill:COB});
      }
    }
    for(var q2=0;q2<xs.length;q2++){
      var v = X.av[q2];
      el(s,'circle',{cx:PAD+AW*xs[q2],cy:mid-v*h*0.42,r:3+4.5*Math.abs(v),fill:INK,opacity:0.85});
    }
    txt(s, PAD, y0+h+112, 'position  x', {fill:MUT});
  }

  //  N1 lower panel: xi(theta) accumulating bin by bin as the fragments advance
  function drawXiCat(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 30, h = opts.h || 240;
    catBuild(); var X = xiBuild();
    var st = opts.stage == null ? 0 : opts.stage;
    //  Bin 0 is kept. It straddles the smallest separations, where xi is close
    //  to the field's variance, and it is what makes the panel read as a
    //  correlation function -- large and positive, decaying, with the bump's
    //  ringing on the way down -- rather than as scatter about zero.
    var B0 = 0, mx = 0, b;
    for(b=B0;b<XINB;b++){ mx = Math.max(mx, Math.abs(X.xi[b]), Math.abs(X.tru[b])); }
    mx *= 1.15;
    function Y(v){ return y0 + h/2 - h/2*v/mx; }
    var T0 = xiTheta(B0), T1 = xiTheta(XINB-1);
    function XT(t){ return PAD + AW*(t-T0)/(T1-T0); }
    el(s,'line',{x1:PAD,y1:Y(0),x2:PAD+AW,y2:Y(0),stroke:RULE,'stroke-width':2});
    el(s,'line',{x1:PAD,y1:y0,x2:PAD,y2:y0+h,stroke:RULE,'stroke-width':2});
    txt(s, Math.max(PAD-64,2), Y(0)+9, 'ξ', {fill:MUT,'font-size':30,'font-style':'italic'});
    txt(s, PAD, y0+h+40, 'separation  θ', {fill:MUT,'font-size':26});

    //  No reference curve and no in-plot legend: the panel carries the pair
    //  count and its axes, nothing else. The field's own correlation function
    //  is still computed (xiBuild) -- it sets the vertical scale -- but it is
    //  not drawn.
    var shown = [];
    if(st >= 1 && st <= XISTOP.length) shown = XISTOP.slice(0, st);
    else if(st > XISTOP.length){ for(b=B0;b<XINB;b++) shown.push(b); }
    if(st > XISTOP.length){
      var dd='';
      for(b=B0;b<XINB;b++) dd += (b>B0?'L':'M')+XT(xiTheta(b)).toFixed(1)+' '+Y(X.xi[b]).toFixed(1)+' ';
      el(s,'path',{d:dd,fill:'none',stroke:COB,'stroke-width':3});
    }
    for(var q=0;q<shown.length;q++){
      var bb = shown[q];
      el(s,'circle',{cx:XT(xiTheta(bb)),cy:Y(X.xi[bb]),r: st>XISTOP.length ? 6 : 11,
                     fill: st>XISTOP.length ? COB : ACC});
    }
  }

  //  W2 -- the product that breaks, folded into the two rows themselves: no
  //  separate "their product" row. Two catalogues never coincide, so their
  //  product is zero everywhere -- that's catalogue c's label. One catalogue
  //  against itself is the opposite failure, a self-pair at every point, so
  //  the product diverges -- that's catalogue a's label.
  function drawProducts(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w;
    var xa = cat8(111), xc = cat8(222);
    var yA = 96, yC = 220;
    function comb(xs, y, col){
      el(s,'line',{x1:PAD,y1:y,x2:PAD+AW,y2:y,stroke:RULE,'stroke-width':2});
      for(var i=0;i<xs.length;i++){
        var X = PAD + AW*xs[i];
        el(s,'line',{x1:X,y1:y,x2:X,y2:y-58,stroke:col,'stroke-width':2.5});
      }
    }
    comb(xa, yA, COB);
    txt(s, PAD, yA+34, 'catalogue a', {fill:COB,'font-size':27});
    txt(s, PAD+AW-360, yA+34, 'product with itself:', {fill:MUT,'font-size':26});
    txt(s, PAD+AW-108, yA+42, '\u221e', {fill:ACC,'font-size':42});
    comb(xc, yC, TEAL);
    txt(s, PAD, yC+34, 'catalogue c', {fill:TEAL,'font-size':27});
    txt(s, PAD+AW-460, yC+34, 'product with a:  zero, everywhere', {fill:ACC,'font-size':27});
  }

  //  W2 — the fix: each source becomes a cloud, and the mask band-limits.
  //  Row 3 of the slide, and it is catalogue a from row 1 bloomed — same
  //  positions, so the drag visibly grows the clouds around the very deltas
  //  the row above shows. Drawn in CINNABAR, not the combs' blue: the smoothed
  //  mask is a different object from the raw catalogue, and the colour is what
  //  says so at a glance.
  //  At theta_c = 0 the "clouds" are bare deltas and the filled path degenerates
  //  to spikes one sample wide, which anti-aliases into something faint and
  //  uneven; so that state is drawn as explicit stems instead. That is the
  //  state the slide OPENS in — there is no pre-smoothed version to fall back
  //  on, the drag is the whole demonstration.
  function drawCloud(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 14, h = opts.h || 115;
    var xs = cat8(111), sp = 1/NS8;
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    if(THC <= 0){
      // 58px, the same stem height as the two combs above, so the three rows
      // read as one line of objects rather than as two sizes of thing.
      for(var i=0;i<xs.length;i++){
        var X = PAD + AW*xs[i];
        el(s,'line',{x1:X,y1:y0+h,x2:X,y2:y0+h-58,stroke:ACC,'stroke-width':2.5});
      }
    } else {
      var w = catGrid(xs, THC), mx = 0, j;
      for(j=0;j<NX;j++) mx = Math.max(mx, w[j]);
      var d = 'M ' + PAD + ' ' + (y0+h);
      for(j=0;j<NX;j++) d += ' L ' + (PAD+AW*j/(NX-1)).toFixed(1) + ' ' + (y0+h-w[j]/mx*h).toFixed(1);
      d += ' L ' + (PAD+AW) + ' ' + (y0+h) + ' Z';
      el(s,'path',{d:d,fill:ACC,opacity:0.16});
      var d2='';
      for(j=0;j<NX;j++) d2 += (j?'L':'M')+(PAD+AW*j/(NX-1)).toFixed(1)+' '+(y0+h-w[j]/mx*h).toFixed(1)+' ';
      el(s,'path',{d:d2,fill:'none',stroke:ACC,'stroke-width':2.5});
    }
    txt(s, PAD, y0+h+40, 'w̄(x)', {fill:ACC,'font-size':27});
    var r = THC/sp, lab = {fill: (r > 0.6 && r < 1.8) ? TEAL : MUT, 'font-size':27};
    if(THC <= 0) txtsub(s, PAD+AW-520, y0+h+40, 'θ', 'c', '  =  0  —  bare delta functions.  drag ▸', lab);
    else txt(s, PAD+AW-520, y0+h+40, 'cloud size = ' + r.toFixed(2) + ' × the source spacing', lab);
  }

  //  W3 — the correlation-function view: distinct pairs vs the self-pair spike
  function drawXi(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = 40, h = opts.h || 260, NT = 90;
    var xi = [], var0 = 0, k;
    for(k=1;k<KMAX;k++) var0 += 2*Cfun(k);
    for(var t=0;t<NT;t++){
      var th = t/(NT-1)*0.075, acc = 0;
      for(k=1;k<KMAX;k++) acc += 2*Cfun(k)*Math.cos(2*Math.PI*k*th);
      xi.push(acc);
    }
    var mx = var0;
    function Y(v){ return y0 + h*(1 - 0.86*v/mx) - h*0.07; }
    el(s,'line',{x1:PAD,y1:Y(0),x2:PAD+AW,y2:Y(0),stroke:RULE,'stroke-width':2});
    var d='';
    for(var t2=1;t2<NT;t2++) d += (t2>1?'L':'M')+(PAD+AW*t2/(NT-1)).toFixed(1)+' '+Y(xi[t2]).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    txt(s, PAD+AW*0.30, Y(xi[20])-30, 'distinct pairs  ξ(θ)', {fill:INK});
    // the self-pair spike at zero lag
    el(s,'line',{x1:PAD,y1:Y(0),x2:PAD,y2:Y(var0),stroke:ACC,'stroke-width':7,'stroke-linecap':'round'});
    el(s,'circle',{cx:PAD,cy:Y(var0),r:9,fill:ACC});
    txt(s, PAD+22, Y(var0)+10, 'self-pairs at zero separation:  ⟨a²⟩', {fill:ACC});
    txt(s, Math.max(PAD-82,2), Y(0)+9, 'ξ', {fill:MUT});
    txt(s, PAD, y0+h+44, 'separation  θ', {fill:MUT});
  }
  //  W3 — and in harmonic space it is a flat line
  function drawWhite(s, opts){
    clear(s); geom(opts);
    var PAD = _x0, AW = _w, y0 = opts.y0 || 30, h = opts.h || 260, Y = logY(y0,h,KMAX);
    el(s,'line',{x1:PAD,y1:y0+h,x2:PAD+AW,y2:y0+h,stroke:RULE,'stroke-width':2});
    txtsub(s, Math.max(PAD-86,2), y0+18, 'C', 'ℓ', '', {fill:MUT});
    txt(s, PAD, y0+h+44, 'multipole  ℓ', {fill:MUT});
    var d='';
    for(var k=1;k<KMAX;k++) d += (k>1?'L':'M')+XK(k,KMAX).toFixed(1)+' '+Y(Cfun(k)).toFixed(1)+' ';
    el(s,'path',{d:d,fill:'none',stroke:INK,'stroke-width':3.5});
    txt(s, XK(150,KMAX), Y(Cfun(150))-26, 'signal  Cℓ', {fill:INK});
    // white level: the self-pair variance shared over the modes of the sample
    var var0 = 0;
    for(var k2=1;k2<KMAX;k2++) var0 += 2*Cfun(k2);
    var wl = var0/NSRC;
    el(s,'line',{x1:PAD,y1:Y(wl),x2:PAD+AW,y2:Y(wl),stroke:ACC,'stroke-width':3.5});
    txt(s, XK(150,KMAX), Y(wl)-26, 'self-pairs: flat, at every ℓ', {fill:ACC});
  }

  // ---------- the equation ledger ----------
  //  Built here rather than pasted into every slide, so the sequence can only be
  //  defined once. MathJax has already run by now, so it is asked to typeset.
  //  [latex, the step it appears on, the name a person would say for it]
  //  The ledger is a grid, and the grid is the argument: row 1 is the unmasked
  //  field, row 2 is what the mask does to it — each masked object sitting
  //  directly under its unmasked twin — and row 3 is how you undo it.
  //  {tex, step it appears on, name, column, row, optional note, optional span}
  var EQS = [
    {tex:'a(x)', step:0, name:'field', col:1, row:1},
    {tex:'a_\\ell=\\sum_x a(x)\\,e^{-i\\ell x}', step:1, name:'Fourier transform', col:2, row:1},
    {tex:'a(x)=\\sum_\\ell a_\\ell\\,e^{+i\\ell x}', step:1, name:'inverse', col:3, row:1},
    {tex:'C_\\ell=\\langle |a_\\ell|^2\\rangle', step:1, name:'power spectrum', col:4, row:1},

    {tex:'\\tilde a(x)=w(x)\\,a(x)', step:2, name:'mask', col:1, row:2, sub:0},
    //  W is used three slides running -- here, in the four-point line, and in
    //  the narrow-kernel line -- so it gets defined the moment it appears.
    {tex:'W_\\ell=\\sum_x w(x)\\,e^{-i\\ell x}', step:2, name:'mask modes', col:2, row:2, sub:0},
    {tex:'\\tilde a_\\ell=\\sum_{\\ell\'} W_{\\ell-\\ell\'}\\,a_{\\ell\'}', step:2, name:'mode coupling', col:3, row:2, sub:1},
    {tex:'\\langle \\tilde C_\\ell\\rangle=\\sum_{\\ell\'} |W_{\\ell-\\ell\'}|^2\\,C_{\\ell\'}', step:2, name:'pseudo-Cℓ', col:4, row:2, sub:2},

    {tex:'\\tilde C_b=\\frac{1}{N_b}\\sum_{\\ell\\in b}\\tilde C_\\ell', step:3, name:'bandpower', col:1, row:3},
    {tex:'(|W|^2)_{bb\'}=\\frac{1}{N_b}\\sum_{\\ell\\in b}\\sum_{\\ell\'\\in b\'} |W_{\\ell-\\ell\'}|^2', step:3, name:'binned coupling', col:2, row:3},
    {tex:'\\hat C_b=\\big[(|W|^2)_{bb\'}\\big]^{-1}\\,\\tilde C_{b\'}', step:3, name:'decoupled', col:3, row:3},

    {tex:'{\\rm Cov}\\big(\\tilde C_\\ell,\\tilde C_{\\ell\'}\\big)\\propto\\Big|\\sum_{\\ell\'\'} W_{\\ell-\\ell\'\'}\\,W^{*}_{\\ell\'-\\ell\'\'}\\,C_{\\ell\'\'}\\Big|^{2}',
     step:4, name:'four-point', col:1, row:1, span:2,
     note:'one sum over ℓ″ for every element of the ℓ, ℓ′ matrix'},
    {tex:'{\\rm Cov}\\big(\\tilde C_\\ell,\\tilde C_{\\ell\'}\\big)\\simeq 2\\,\\bar C_{\\ell\\ell\'}^{\\,2}\\,\\Big|\\textstyle\\sum_x w^2(x)\\,e^{-i(\\ell-\\ell\')x}\\Big|^{2}',
     step:5, name:'narrow-kernel approximation', col:1, row:2, span:3, hold:true},
    {tex:'\\bar C_{\\ell\\ell\'}\\equiv\\tfrac12\\big[C_\\ell+C_{\\ell\'}\\big]', step:5, name:'C at the midpoint', col:4, row:2, hold:true},
    //  The narrow-kernel line is written out in full -- no Xi, no W^(2). The
    //  coupling kernel of a covariance is built from the SQUARED mask, and
    //  |sum_x w^2(x) e^{-i(k-k')x}|^2 is not |W_{k-k'}|^2; spelling the sum out
    //  is the only way to show that without inventing a second symbol.
    //  Both entries carry hold:true, so their boxes exist from the base state.
    //  For the record, the paper's eq:nka_simple is
    //      Cov(C~^ab_l, C~^cd_l') = C^ac_(l,l') C^bd_(l,l') Xi_ll'(w_a w_c, w_b w_d) + (c<->d)
    //  with C_(l,l') = (C_l + C_l')/2. This deck has ONE field and ONE mask, so
    //  a = b = c = d: both C factors are the same Cbar, both mask arguments are
    //  w^2, and the (c<->d) term doubles it. The a,b,c,d indices are said in the
    //  notes, where the several-field case belongs.
    {tex:'\\tilde a(x)=\\sum_i w_i\\,a_i\\,\\delta(x-x_i)', step:6, name:'catalogue field', col:1, row:1},
    {tex:'w(x)=\\sum_i w_i\\,\\delta(x-x_i)', step:6, name:'catalogue mask', col:2, row:1},
    //  the object-wise twin of a_k = sum_x a(x) e^{-ikx} on slide 3. The deck
    //  stops the ledger here on purpose: everything downstream of the modes is
    //  unchanged from slides 3-5, and what breaks is upstream, in the mask.
    {tex:'\\tilde a_\\ell=\\sum_i w_i\\,a_i\\,e^{-i\\ell x_i}', step:6, name:'catalogue modes', col:3, row:1},
    //  Slide 11 opens on the PROBLEM, not on the answer: once the mask is
    //  band-limited the covariance kernel wants the mask PRODUCT, and for a
    //  catalogue against itself that product carries every source paired with
    //  itself. Wolz eq. 2.24 -- distinct pairs go through the NKA, the self-pair
    //  sum is kept and treated exactly.
    {tex:'\\bar w^{2}(x)=\\underbrace{\\textstyle\\sum_{i\\neq j} w_iw_j\\,G(x-x_i)\\,G(x-x_j)}_{\\rm distinct\\;pairs}+\\underbrace{\\textstyle\\sum_i w_i^{2}\\,G^{2}(x-x_i)}_{\\rm self\\;pairs}',
     step:8, name:'factor the mask product', col:1, row:1, span:4, sub:0},

    //  The Nagura act opens on the pair count itself. The two entries are the
    //  same object twice: the thing you measure, and the thing it equals in
    //  harmonic space -- a linear map of the WINDOWED spectrum, normalised by
    //  the pairs that actually exist (Nagura eq. 8, from Friedrich 2020 app. C).
    {tex:'\\hat\\xi(\\theta)=\\frac{\\sum_{ij\\in\\theta} w_iw_j\\,a_ia_j}{\\sum_{ij\\in\\theta} w_iw_j}',
     step:10, name:'pair count', col:1, row:1},
    {tex:'\\xi_i=\\frac{n^2}{N_{{\\rm pair},i}}\\,2\\pi\\sum_\\ell\\big[P_{\\ell+1}-P_{\\ell-1}\\big]_i\\,\\tilde C_\\ell',
     step:10, name:'its transform', col:2, row:1, sub:4},
    //  Nagura eq. 10: the kernel is the Legendre polynomial P_l(cos theta),
    //  averaged over the angular bin via the recursion relation -- which is
    //  what the bracket with the two cos-theta limits means.
    {tex:'\\big[P_{\\ell+1}-P_{\\ell-1}\\big]_i\\equiv\\big[P_{\\ell+1}(x)-P_{\\ell-1}(x)\\big]_{\\cos\\theta_{i,+}}^{\\cos\\theta_{i,-}}',
     step:10, name:'legendre kernel, averaged over bin i', col:3, row:1, sub:4}
  ];
  function ledger(host, step, from, stage){
    from = from || 0;
    if(stage == null) stage = Infinity;
    var html = '';
    for(var i=0;i<EQS.length;i++){
      var e = EQS[i];
      //  `hold` entries render one step EARLY, invisible: the slide reserves
      //  their box from the base state so nothing below the ledger moves when
      //  the fragment that lights them fires.
      var ghost = false;
      if(e.step > step){ if(!e.hold || e.step !== step + 1) continue; ghost = true; }
      if(e.step < from) continue;
      // a staged equation (has `sub`) is invisible until the fragment that
      // introduces it — not just un-highlighted. After that it stays, dimmed.
      if(e.sub != null && e.step === step && stage < e.sub) continue;
      var live = !ghost && (e.step === step) && (e.sub == null || e.sub === stage);
      html += '<div class="' + (live?'on':'') + (ghost?' ghost':'') + '" style="grid-column:' + e.col +
              (e.span ? ' / span ' + e.span : '') + ';grid-row:' + e.row + '">' +
              '<span class="nm">' + e.name + '</span>' +
              '<span class="eq">\\(' + e.tex + '\\)</span>' +
              (e.note ? '<span class="note">' + e.note + '</span>' : '') +
              '</div>';
    }
    host.innerHTML = html;
  }

  // ---------- mask picker ----------
  function picker(host){
    host.innerHTML = '';
    for(var i=0;i<MASKS.length;i++){
      (function(i){
        var b = document.createElement('button');
        b.textContent = MASKS[i].name;
        b.className = (i === pick) ? 'on' : '';
        b.onclick = function(){ pick = i; buildAll(); renderAll(); };
        host.appendChild(b);
      })(i);
    }
  }

  // ---------- render one slide ----------
  //  The NKA used to carry a sentence under the ledger saying what the
  //  approximation assumes. The entry names now carry it, and a sentence that
  //  restates the equation beside it is the gloss this deck keeps cutting; it
  //  lives in the speaker notes. Slides that hard-code their own .saywhat (the
  //  self-pair slide) still have one.
  var COST = {4:'<i>O</i>(ℓ<sub>max</sub><sup>6</sup>)',
              5:'<i>O</i>(ℓ<sub>max</sub><sup>3</sup>) — same as the estimator'};
  //  A slide may advance its ledger with a reveal fragment: data-frag-step is the
  //  step it moves to once any fragment on the slide is showing. Used by the
  //  covariance slide to stage exact -> NKA -> error.
  //  A staged slide reveals its panels one fragment at a time; stage 0 is the
  //  base state. Unstaged slides are "everything on".
  function stageOf(root){
