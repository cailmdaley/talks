<section data-layout="figure">
  <h2>A schematic drawn in pencil and glaze</h2>
  <figure>
    <svg viewBox="0 0 1600 600" role="img" aria-label="A pencil arrow from one label to another, and a glazed band that arrives as a step">
      <defs>
        <marker id="drawn-arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0.5 L12 5 L0 9.5" class="fill-none stroke-ink" stroke-width="1.6"/></marker>
      </defs>
      <path d="M420 150 H1160" class="pencil fill-none stroke-ink" stroke-width="2.2" marker-end="url(#drawn-arrow)" opacity="0.8"/>
      <text x="200" y="165" font-size="44">Measured</text>
      <text x="1220" y="165" font-size="44">Inferred</text>
      <g class="fragment">
        <rect x="100" y="320" width="1400" height="160" rx="3" class="glaze fill-butter"/>
        <text x="800" y="415" font-size="44" text-anchor="middle">a band that arrives as a step</text>
      </g>
    </svg>
  </figure>
</section>
